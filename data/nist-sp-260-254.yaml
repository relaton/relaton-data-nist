abstract:
- language: en
  script: Latn
  content: The National Institute of Standards and Technology (NIST) Standard Reference
    Material® (SRM®) 956e Electrolytes in Frozen Human Serum is intended for use in
    the calibration and validation of procedures and methods employed in clinical
    analysis for the determination of electrolytes in either diluted or undiluted
    human serum or plasma. This SRM can be used for calibrating direct-reading ion-selective
    electrode (ISE) analyzers, and for validating methods used to measure electrolytes
    in similar matrices. The material was produced commercially in accordance with
    the protocol described in Clinical Laboratory Standards Institute (CLSI) Standard
    C29-A2, Standardization of Sodium and Potassium Ion-Selective Electrode Systems
    to the Flame Photometric Reference Method. This publication documents the production,
    analytical measurements, and statistical evaluations leading to the certification
    of the SRM.

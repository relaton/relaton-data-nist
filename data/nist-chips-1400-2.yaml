abstract:
- language: en
  script: Latn
  content: 'The CHIPS and Science Act3 appropriated $50 billion to the Department
    of Commerce’s CHIPS for America program, both, to support semiconductor research
    and development (R&D) and to expand semiconductor manufacturing capacity in the
    United States. This includes $39 billion for the Department of Commerce (the Department)
    to expand domestic semiconductor manufacturing capacity through the incentives
    program and $11 billion to advance U.S. leadership in semiconductor R&D. R&D advances
    will be realized through four programs: the National Semiconductor Technology
    Center (NSTC), the National Advanced Packaging Manufacturing Program (NAPMP),
    the CHIPS Metrology Program, and a Manufacturing USA institute. These investments,
    across both the R&D and incentives programs, seek to strengthen U.S. competitiveness,
    support domestic manufacturing and innovation, and create good jobs across the
    country.'

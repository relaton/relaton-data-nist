abstract:
- language: en
  script: Latn
  content: 'Business recovery after disasters is a complex process influenced by various
    factors. By compiling research on business recovery, this work seeks to support
    researchers and practitioners in identifying research on effective approaches
    to measuring and promoting business resilience. This bibliography brings together
    studies on various disaster types, business sectors, and methodologies, demonstrating
    the complexity of business recovery. The objectives of this work are to: 1) report
    and summarize academic studies on business recovery after disasters, 2) provide
    a concise presentation of each study''s context and methodology, and 3) highlight
    the significance of each study''s findings to inform future research and practice.
    The compilation of 39 peer-reviewed studies demonstrates the multifaceted nature
    of business recovery, revealing that factors such as access to financial resources,
    business characteristics, and owner demographics play a crucial role in determining
    recovery outcomes. The studies also emphasize the importance of considering the
    built environment, lifeline services, and production inputs in understanding business
    recovery. While the research has made significant contributions, a notable limitation
    is the lack of validation efforts in many studies, underscoring the need for continued
    research to develop more robust and validated methods for measuring business recovery.
    By documenting the various approaches to measuring recovery, this work sheds light
    on the challenges and opportunities in measuring business recovery and promoting
    community resilience.'

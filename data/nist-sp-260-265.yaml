abstract:
- language: en
  script: Latn
  content: Validation of rapid sterility testing technologies is critical for their
    implementation in supporting safety of cell and gene therapy products. However,
    many rapid sterility testing methods rely on newer measurands versus traditional
    growth-based methods, and no ground-truth, fit-forpurpose reference materials
    currently exist for rapid methods, especially molecular methods based on nucleic
    acid measurements. Microbial cell count and genome copy count are key properties
    that can support the adoption of molecular methods but are challenging to quantify.
    In the feasibility studies described herein, NIST performed multiple characterizations
    of commercially available microbial cell materials commonly used for qualification
    and validation of sterility testing to identify potential paths forward for additional
    certified values on these materials. Samples consisted of viable, single-strain
    microbial reference materials certified by the manufacturer for number of colony-forming
    units (CFU). NIST performed cell count and characterization experiments using
    CFU (culturable cells), Coulter counting (total cells), fluorescence flow cytometry
    (total cells, total genome copies), and impedance flow cytometry(total cells)
    methods. Only materials with relatively high cell concentrations (cell number
    > 105per mL) were found to be suitable for the methods performed herein, and acellular
    material varied across products and sometimes interfered with measurements. It
    was concluded that factors including acellular material, cell aggregation, and
    dead cells contributed to discrepancies among CFU counts, total cell counts, and
    genome copy counts, likely stemming from both strain-specific cell characteristics
    and manufacturer-specific processes. Based on these results, a draft roadmap on
    optimizing characterization methods for a given material was developed to assist
    stakeholders interested in assigning total cell count and genome copy count to
    microbial cell reference materials. The results and lessons learned were shared
    with the Working Group 1 – Reference Materials of the NIST Rapid Microbial Testing
    Methods (RMTM) Consortium to support understanding of challenges and opportunities
    related to adding new certified values to existing reference materials. Experimental
    details and a results summary are provided here to help inform all RMTM stakeholders
    developing or using microbial cell reference materials for molecular rapid microbial
    testing methods.

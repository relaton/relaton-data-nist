abstract:
- language: en
  script: Latn
  content: Standards provide critical benefits across a wide variety of contexts,
    including safety and health, environmental protection, and quality of products
    and services. However, while these benefits are generally acknowledged, estimating
    the social and economic value of standards and determining how specific entities
    and activities influence their development require careful analysis. In October
    of 2018, the National Institute of Standards and Technology (NIST) asked the RAND
    Corporation to estimate the benefit of NIST’s research contributing to particular
    fire safety standards. The original objectives of the project were to (1) document
    the role of the NIST in the standards development process, (2) estimate the value
    these standards provide to society, and (3) thereby inform the economic value
    of NIST’s contribution to these standards. This report presents results for the
    first two objectives. Given that NIST’s contribution is one of several inputs
    combining to create these standards, NIST’s share of the credit for their value
    could note quantified. Our analysis focused on case studies in standards for home
    smoke alarms and for protecting structures at the wildland-urban interface (WUI).
    Our analysis draws on a wide variety of qualitative and quantitative methods to
    holistically describe the impacts of these standards and Nist’s role in their
    development. The intended audience of this report includes those who work on fire
    safety research, fire safety standards, building codes, and technology transfer.
    The conclusions presented here may also be of interest for broader resource allocation
    and federal budget justification purposes. Finally, this report was written to
    be accessible to any interested members of the general public.

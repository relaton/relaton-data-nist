abstract:
- language: en
  script: Latn
  content: Ensuring the security of routers is crucial for safeguarding not only individuals’
    data but also the integrity and availability of entire networks. With the increasing
    prevalence of smart home IoT devices and remote work setups, the significance
    of consumer-grade router cybersecurity has expanded, as these devices and applications
    often rely on routers in the home to connect to the internet. This report presents
    the consumer-grade router profile, which includes cybersecurity outcomes for consumer-grade
    router products and associated requirements from router standards.

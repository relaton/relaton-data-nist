abstract:
- language: en
  script: Latn
  content: The NIST-led Rapid Microbial Testing Methods (RMTM) Consortium launched
    in 2020 to develop standards and measurement-based solutions to advance the use
    of RMTMs in advanced therapy products. In April 2024, NIST hosted the 4th annual
    workshop on RMTMs to update the community on RMTM Consortium efforts and to advance
    Consortium deliverables. This report provides a summary of workshop activities
    and findings. The workshop consisted of several working sessions, 1 h to 2 h in
    length, focused on specific Working Group activities and deliverables. Day 1 was
    open to the public, and Day 2 was for Consortium members only. Parties that participated
    in the workshop included advanced therapy producers, RMTM assay/instrument developers,
    and cell reference material producers. Progress was made on multiple Consortium
    activities via the session discussions, and feedback was provided to help scope
    potential future Consortium activities. Overall, the workshop helped ensure relevance
    and impact of RMTM Consortium activities.

abstract:
- language: en
  script: Latn
  content: It has become increasingly important for community planning to include
    resilience and sustainability concepts, given the onset of increasing weather
    and climate extremes and stressors. The definitions of resilience and sustainability
    continue to be somewhat ambiguous in current literature and policy; some see them
    as synonyms and use them interchangeably, while others see them as somewhat intertwined
    or completely independent of each other. This research looks at the interactions
    of definitions of resilience and sustainability across various physical, social,
    and environmental domains. By using survey data from experts working across diverse
    applications of resilience and sustainability, we analyze the connections between
    the domains, which can help encourage more efficient and effective efforts to
    address future hazards. Our findings suggest that when it comes to sustainability
    and resilience, experts perceive three main differences in (a) temporal application,
    with resilience being short-term and sustainability being long-term, (b) focus
    areas, with resilience as hazard-oriented and sustainability and ecosystem-oriented,
    and (c) their codependence.

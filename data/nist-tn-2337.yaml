abstract:
- language: en
  script: Latn
  content: Mechanical systems in large commercial buildings, particularly their heating,
    ventilating, and air-conditioning (HVAC) systems, routinely waste significant
    amounts of energy and thus levy significant unnecessary economic costs upon building
    owners. This happens due to “faults”—improper design or installation, improper
    control actions, or operational equipment malfunctions—occurring within the HVAC
    systems. Saying a commercial building is “large” refers not only to its size,
    but that it has an automatic control system continually generating large amounts
    of data from operation of its HVAC system. Those data are resources that software
    exercising well-developed techniques of artificial intelligence can leverage for
    automated fault detection and diagnosis (AFDD) done in real time. Ongoing research
    and development is necessary to ensure novel, “cutting-edge” ideas that can improve
    AFDD actually become, as just stated, “well-developed techniques” in their effectiveness.
    That requires software having distinctly research-oriented capabilities that go
    beyond what is available from AFDD software commercially marketed to building
    owners. This document first introduces, and then broadly details, new software
    having the research-oriented capabilities the AFDD industry needs. The software
    is offered in the public domain as the foundation for an ongoing, collaborative,
    open-source software development project named ZandrEA. The ZandrEA project welcomes
    collaboration from stakeholders throughout the academic and industrial communities
    interested in advancing the technology of AFDD, and in supporting the transfer
    of that technology into marketable products and services.

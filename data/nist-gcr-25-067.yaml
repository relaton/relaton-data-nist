abstract:
- language: en
  script: Latn
  content: The National Institute of Standards and Technology (NIST) contracted with
    the Business Research Division (BRD) at the Leeds School of Business, University
    of Colorado Boulder, to measure the economic contribution of NIST for fiscal years
    2014, 2015, and 2016. NIST has two campuses separated by about 1,500 miles—one
    in Gaithersburg, Maryland, and the other in Boulder, Colorado. Created 116 years
    ago, Congress established NIST to standardize measurement—something that was reportedly
    stifling U.S. industrial competitiveness. Today, as a unit of the U.S. Department
    of Commerce (DOC), NIST researchers continue to create standards, but also study
    technology that broadly leads to innovation through the public dissemination of
    research. This study examines the economic contribution of NIST as an operating
    business unit—the economic contribution of the flow of funds. This report does
    not quantify the value or economic impact of the basic research advancements or
    the licensed, commercialized products.

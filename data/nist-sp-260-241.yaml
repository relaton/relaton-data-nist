abstract:
- language: en
  script: Latn
  content: A new Reference Material (RM), designated RM 8013, has been developed for
    the temperature and enthalpy calibration of differential scanning calorimeters
    (DSCs). The addition of this new RM expands the applicable range of NIST’s DSC-related
    calibration standards to include sub-ambient temperatures and represents an attractive
    alternative to the previous option, Standard Reference Material® (SRM®) 2225,
    which was discontinued in 2017. RM 8103 was sourced from a single lot of high-purity
    ( 99%) adamantane. The transition temperature of RM 8103 has been determined
    to be equal to (-64.58 ± 0.20) °C, while the enthalpy of transition has been determined
    to be equal to (21.64 ± 0.34) J·g-1. Both values were determined via DSC measurements
    using an instrument calibrated with certified reference materials obtained from
    two different national metrology institutes. This document provides all relevant
    measurement and analysis details for the development of RM 8103.

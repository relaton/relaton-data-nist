abstract:
- language: en
  script: Latn
  content: NIST SP 365, Metric Conversion Card is a laminated wallet size card includes
    an 8 cm and 80 mm ruler with approximate unit conversion factors between common
    International System of Units (SI) and U.S. customary measurement units for length,
    area, mass, volume, and temperature (exact formula). This job aid is useful for
    making quick mathematical unit conversion calculations.

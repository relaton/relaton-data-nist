abstract:
- language: en
  script: Latn
  content: Non-targeted analysis (NTA) is a technique for the identification of unknown
    chemicals in complex materials, such as novel per- and polyfluoroalkyl substances
    (PFAS) in environmental materials and commercial formulations. The PFAS NTA Interlaboratory
    Study (PFAS-NTAILS) was designed and administered to understand the measurement
    comparability of laboratories using NTA techniques for the identification of PFAS.
    Participating laboratories analyzed three samples containing varying amounts of
    PFAS and other chemicals and reported the identified PFAS in each of the samples.
    This report discusses the design of the PFAS-NTAILS study, the description of
    the participants and their methods, and the initial results of the study.

abstract:
- language: en
  script: Latn
  content: This work is a compilation and summary of the quasi-static mechanical properties
    of a novel cobalt-free maraging steel, M789, that underwent a series of heat treatments
    which included solution annealing, intercritical annealing, and aging. This work
    utilized a single laser powder bed fusion (PBF-L) build to ensure uniform chemistry
    of the batch of specimens. The tensile geometry consisted of miniaturized tensile
    specimens, tested to failure to assess properties such as the elastic modulus,
    yield strength, ultimate tensile strength, uniform elongation, and total elongation.
    The results are presented in tabular and graphical format.

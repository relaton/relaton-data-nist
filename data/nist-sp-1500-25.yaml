abstract:
- language: en
  script: Latn
  content: The National Institute of Standards and Technology and the International
    Centre for Diffraction Data co-hosted a workshop on 17-18 October 2023 to identify
    and prioritize the goals, challenges, and opportunities for critical and emerging
    technology needs within industry, with an emphasis on leveraging artificial intelligence,
    data-driven methodologies, and high-throughput and automated workflows for accelerating
    x-ray-based structural analysis for materials development and manufacturing. Participants,
    predominantly from industry, gathered in-person at ICDD headquarters in Newtown
    Square, Pennsylvania. The findings of this workshop report provide critical input
    for strategic planning and the convening activities serve as a kickoff for future
    public-private cooperation.

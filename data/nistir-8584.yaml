abstract:
- language: en
  script: Latn
  content: Morphing of face photographs present a threat to identity processes; for
    example, two people being able to use one passport. The threat exists in applications
    that allow users to submit their own photos where digital history is unknown.
    The threat can be reduced significantly if photo capture is trusted. When that
    cannot be implemented, software-based morph detection algorithms can be deployed.
    While automated morph detection has its strengths and weaknesses, independent
    benchmarks suggest that some morph detectors are now accurate enough to have operational
    utility. This document guides organizations in detecting, then investigating morphed
    face photographs in their operational settings.

abstract:
- language: en
  script: Latn
  content: The mineral pyrrhotite was synthesized from iron and sulfur starting materials
    for one component in a four-component reference material (RM 8154-Pyrrhotite in
    Concrete) to be used to evaluate the presence of sulfur in aggregate (crushed
    rock) and concrete. Pyrrhotite in aggregate used in concrete has and continues
    to result in the degradation and failure of residential foundations around Tolland
    County, CT (Northeastern Connecticut and South-Central Massachusetts). A total
    of 254 bottles of 5 grams were produced. This Pyrrhotite in Concrete suite reference
    material will fill a current void in available testing materials and will allow
    laboratories to advance and unify methods of analysis. Scaling up production of
    the pyrrhotite component revealed considerations in design and safety ultimately
    incorporated.

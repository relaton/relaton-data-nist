abstract:
- language: en
  script: Latn
  content: With the goal of advancing US competitiveness and excellence in the materials
    and manufacturing industries, we present our vision for the National Center for
    Autonomous Materials Science. The objective of this center is to enable and promote
    the use of autonomous methodologies for materials science in industrial applications.
    Virtually every industry is defined and limited by the materials and processing
    available to it. The foundation of material science is to elucidate and exploit
    the relationships between structure, processing, and properties within materials
    which affect its ultimate performance. Using traditional research approaches this
    is typically a lengthy, costly, and complex process. New paradigms of conducting
    research, leveraging cutting edge AI and automation technology, are being developed
    that can address grand challenges in materials research and development that are
    otherwise intractable. These new research paradigms additionally accelerate the
    acquisition of knowledge and understanding of critical materials problems. Unfortunately,
    most industrial R\&D as well as some academic research does not take full advantage
    of these new research paradigms. The U.S. needs to foster the adoption of these
    new research paradigms as a national effort in order to accelerate and maintain
    global technological leadership. Our vision is for the US to support an initiative
    that would facilitate the industry-wide adoption of these new materials science
    research paradigms.

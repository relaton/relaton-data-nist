abstract:
- language: en
  script: Latn
  content: This work investigates the efficacy of solution treatment and over-aging
    (STOA) as a postprocessing step to improve the mechanical properties of laser
    powder bed fusion (PBFL) Ti-6Al-4V that has been subjected to a thermo-hydrogen
    refinement of microstructure (THRM) treatment. THRM was used to promote ductility
    and globalization of the PBF-LTi-6Al-4V microstructure, whereas STOA was leveraged
    to increase the strength through precipitation hardening from coherent Ti3Al particles
    within the α phase, known as the α2phase. An increase in hardness across the α
    phase was measured via nanoindentation, and a small increase in strength was measured
    as a result of over-aging via quasi-static tensile testing, with no loss of ductility.
    Both of these occurrences are consistent with previous studies of Ti3Al precipitation
    leading to increased strength without loss of ductility.

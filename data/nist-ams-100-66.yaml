abstract:
- language: en
  script: Latn
  content: The advantages of additive manufacturing of metal components through laser-based
    powder bed fusion of metals (PBF-LB/M) have been increasingly embraced across
    a variety of industries and applications. But, broader adoption of this manufacturing
    technology requires that computational models and in-situ monitoring of such processes
    be experimentally validated under highly controlled conditions with advanced metrology.
    Such validation of models and in-situ monitoring systems are especially important
    for critical applications that require qualification and certification. Such controlled
    conditions and advanced metrology cannot be readily implemented in commercial
    PBF-LB/M machines due to a variety of constraints and unknowns about machine performance.
    Therefore, a laboratory testbed has been developed to study the Fundamentals of
    Laser-Matter Interaction (FLaMI) at the National Institute of Standards and Technology
    (NIST). This paper outlines the materials and methods to develop such a system,
    as well as to accurately calibrate and characterize the machine performance.

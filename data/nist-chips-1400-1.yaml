abstract:
- language: en
  script: Latn
  content: 'The mission of the National Institute of Standards and Technology’s (NIST)
    CHIPS Research and Development Office (CHIPS R&D) under the Department of Commerce’s
    CHIPS for America Program is to accelerate the development and commercial deployment
    of foundational semiconductor technologies by establishing, connecting, and providing
    access to domestic research efforts, tools, resources, workers, and facilities.
    A key element in achieving these CHIPS R&D goals is to accelerate the private
    sector-led development and deployment by industry of effective technical standards.
    This report describes the outcomes of the CHIPS R&D Standards Summit held in September
    2023, in Washington D.C. in four topic areas: Identifying strategic standards
    priorities; enabling innovation in standards development; promoting a diverse,
    standards-capable workforce; and linking standards and research.'

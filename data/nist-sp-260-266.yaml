abstract:
- language: en
  script: Latn
  content: Periodic stability testing is conducted on a Standard Reference Material
    (SRM) to determine whether the current measured value is consistent with the SRM
    Certificate value. Stability testing performed on SRM 2492 (Bingham Paste Mixture),
    and the identical paste portion of SRM 2493 (Bingham Mortar Mixture), indicated
    evidence that some of the corn syrup specimens used in SRM 2492 may have changed;
    there was no evidence of similar changes in the corn syrup used for SRM 2493.
    As a result of this stability testing, sales of SRM 2492 have ceased. Fortunately,
    the paste portion of SRM 2493 is identical to SRM 2492 in both composition and
    proportion, and can be used as a direct replacement of SRM 2492. In addition,
    measurement procedures documented during the creation of the SRMs were reviewed
    and clarified, and in some cases processes were improved upon. The net effect
    of the improvements was to reduce the measured dynamic viscosity relative expanded
    uncertainty in the mean by at least a factor of 3, and as much as a factor of
    7 across a considerable range of shear rates.

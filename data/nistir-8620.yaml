abstract:
- language: en
  script: Latn
  content: This report summarizes the outcomes of a three-part NIST workshop series
    on digital twins for manufacturing. The workshops convened experts from industry,
    academia, and government to establish a shared understanding of digital twin fundamentals,
    identify barriers and opportunities, and prioritize future directions for research
    and standards development. Discussions emphasized the transformative potential
    of digital twins to improve design, production, and lifecycle management, while
    also highlighting persistent challenges in interoperability; verification, validation,
    and uncertainty quantification (VVUQ); cybersecurity; and workforce readiness.
    The report synthesizes these findings into research priorities and standards needs
    that will guide coordinated efforts to advance trustworthy and scalable digital
    twins in U.S. manufacturing.

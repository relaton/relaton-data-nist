abstract:
- language: en
  script: Latn
  content: 'The 3180 series Standard Reference Materials (SRMs) are single anion solutions
    intended for use as primary calibration standards for the quantitative determination
    of a single anion and are a key link in the traceability chain for analysis measurements
    of those anions made worldwide. The mass fraction of the anions in these materials
    are traceable to the International System of Units (SI). The 3180 series SRMs
    are calibration standards gravimetrically prepared from carefully assayed, high-purity
    materials dissolved in a water-based matrix with nominal mass fractions of 1 mg/g.
    The certified values and expanded uncertainties of these SRMs are determined by
    combining a gravimetric preparation value and a carefully measured ion chromatography
    instrumental value, taking their associated uncertainties into account. Over the
    course of its shelf life, an anion solution standard undergoes stability testing
    to monitor the continued validity of its certified value. Currently, NIST offers
    seven anion standard solutions: bromide, chloride, fluoride, iodide, nitrate,
    phosphate, and sulfate. New lots of these SRMs are produced continuously to meet
    demand and certificates of analysis are issued for each new lot to accurately
    reflect the anion mass fraction and associated uncertainty.'

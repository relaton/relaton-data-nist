abstract:
- language: en
  script: Latn
  content: Industrial wireless is crucial for the vision of increased intelligence
    in industrial automation and enhanced connectivity in various industrial scenarios.
    Although general requirements are usually defined for deploying industrial wireless
    networks in various application classes, the process for individual deployments
    in specific industrial use cases cannot be directly deduced. It still requires
    the exact knowledge of the different industrial process data points and their
    parameters in order to specify the corresponding wireless technology and the deployed
    network specifics. In this work, we introduce an entity relationship diagram (ERD)
    for the mapping between individual wireless use cases, their operational environments,
    the various wireless technology limits, and the deployed wireless technology specifications
    including the network configuration, the deployed wireless nodes parameters, and
    the corresponding radio frequency (RF) setup. This ERD represents the initial
    step to understand the mapping between various industrial use cases and realistic
    deployed wireless networks and build a corresponding database that can be helpful
    in facilitating the procedure for specifying new deployments of industrial wireless
    networks.

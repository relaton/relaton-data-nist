abstract:
- language: en
  script: Latn
  content: Transform your K-12 classroom or home kitchen into a hands-on culinary
    laboratory by swapping volume cups for a digital scale. Explore this metric recipe
    series, hands-on activities, printable worksheets, and videos to build and reinforce
    interdisciplinary math, science, engineering, art, and mathematics (STEAM) skills.
    Apply the metric system in daily life to build confidence, develop proportional
    reasoning, and practice measurement techniques. Companion resources are available
    on the NIST Metric Kitchen website.

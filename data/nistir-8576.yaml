abstract:
- language: en
  script: Latn
  content: This document is a Cybersecurity Framework (CSF) Community Profile developed
    to support United States-based transit agencies. This “Transit Profile” is aligned
    with transit sector priorities and best practices and can be used as a guide for
    prioritizing cybersecurity activities and outcomes or as a starting point for
    building a new program. The Transit Profile was developed to complement, not replace,
    any existing cybersecurity programs, guidelines, or policies that transit agencies
    may rely on or have in place.

abstract:
- language: en
  script: Latn
  content: 'The Manufacturing USA Program Strategic Plan outlines the program’s vision,
    mission, goals, and objectives for the next four years and describes how the Program
    will carry them out, including its technology investment strategy, its role in
    catalyzing private‑sector investment, and the interagency coordination that supports
    its broader efforts. To secure America’s technological superiority over global
    competitors and transform today’s advanced manufacturing innovations into tomorrow’s
    domestic industries, the Manufacturing USA network of innovation institutes develops
    emerging technologies and integrates them into the U.S. supply chain. These public‑private
    partnership institutes unite industry, academia, and government to overcome the
    “valley of death,” promote technology adoption, train the manufacturing workforce,
    build supply chain resilience, and strengthen U.S. industrial dominance. The Program
    is guided by its vision, U.S. global leadership in advanced manufacturing, and
    by its mission to connect people, ideas, and technology to solve industry‑relevant
    advanced manufacturing challenges and enhance industrial competitiveness. In alignment
    with this vision and mission—and with the missions of the participating agencies
    themselves—the participating agencies and institutes work toward four strategic
    goals: Increase the competitiveness of U.S. manufacturing; Transition innovative
    technologies into scalable domestic manufacturing capabilities; Develop an advanced
    manufacturing workforce; and Promote a durable network of institutes serving national
    priorities.'

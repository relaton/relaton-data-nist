abstract:
- language: en
  script: Latn
  content: A valve at the NIST Center for Neutron Research (NCNR) failed during maintenance.
    The authors were asked to support or rule out possible causes of failure, identify
    alloy type, and measure material hardness. The investigation determined the alloy
    was likely a A413.0 or 413.0 aluminum cast alloy. The likely cause of failure
    was mechanical overload. No evidence of fatigue, corrosion, or stress-corrosion
    failure were observed. The microstructure of the cross section showed numerous
    voids distributed throughout the cross section. There were Si and Al-Fe-Si intermetallics
    observed that make an interconnected brittle network across the sample. Both of
    these factors likely contributed to a small elongation at failure.

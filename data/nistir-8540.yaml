abstract:
- language: en
  script: Latn
  content: Significant vulnerabilities have been found in chips. Computer programs
    and methods have been developed to prevent, find, and mitigate them. We proposed
    Secure Hardware Assurance Reference Dataset (SHARD) as a repository of reference
    examples (test cases) of both vulnerable and “clean” hardware IC designs. SHARD
    test cases will enable tool makers to test their techniques and allow chip designers
    to evaluate those tools. SHARD received preliminary funding through NIST Building
    The Future (BTF). This reports what we have achieved with that funding.

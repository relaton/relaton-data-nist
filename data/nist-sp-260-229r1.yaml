abstract:
- language: en
  script: Latn
  content: The National Institute of Standards and Technology (NIST) SRM 1568c Rice
    Flour has value assignments for over 30 analytes, including arsenic species. This
    material is intended to be used for the evaluation of methods for the determination
    of elements and arsenic species in this and similar matrices. The material was
    purchased from commercial vendors. Measurement results were obtained from NIST,
    National Metrology Institute of Japan (NMIJ), and interlaboratory comparison exercises.
    This document describes the material, sample preparations, results, and data analysis.

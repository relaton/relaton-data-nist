abstract:
- language: en
  script: Latn
  content: Recognizing the importance of technical standards in shaping development
    and use of Artificial Intelligence (AI), the President’s October 2023 Executive
    Order on the Safe, Secure, and Trustworthy Development and Use of Artificial Intelligence
    (EO 14110) calls for “a coordinated effort…to drive the development and implementation
    of AI-related consensus standards, cooperation and coordination, and information
    sharing” internationally. Specifically, the EO tasks the Secretary of Commerce
    to “establish a plan for global engagement on promoting and developing AI standards…
    guided by principles set out in the NIST AI Risk Management Framework and United
    States Government National Standards Strategy for Critical and Emerging Technology”
    (NSSCET). This plan, prepared with broad public and private sector input, fulfills
    the EO’s mandate. The plan will be followed by an implementation plan describing
    the engagement actions that NIST and other U.S. government agencies will take
    over the next 180 days.

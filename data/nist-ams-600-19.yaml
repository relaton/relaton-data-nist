abstract:
- language: en
  script: Latn
  content: The Manufacturing USA 2025 Annual Report (covering activities from October
    1, 2022, to September 30, 2023) highlights the impact of the national network
    of 17 public-private manufacturing innovation institutes. Coordinated by the Advanced
    Manufacturing National Program Office and sponsored by the Departments of Commerce,
    Defense, and Energy, the program helps secure U.S. global leadership in advanced
    manufacturing. Its mission is to connect people, ideas, and technology to solve
    industry-relevant advanced manufacturing challenges, thereby enhancing industrial
    competitiveness.

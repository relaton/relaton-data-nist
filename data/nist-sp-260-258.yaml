abstract:
- language: en
  script: Latn
  content: Standard Reference Material (SRM) 927g is intended for use in the standardization
    of procedures employed in clinical analyses for total serum protein, for critical
    evaluation of daily working standards used in these procedures, and as a reference
    standard for assays of total protein by colorimetric methods. A unit of SRM 927g
    consists of 10 ampoules, each containing approximately 2.2 mL of solution.

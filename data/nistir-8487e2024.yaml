abstract:
- language: en
  script: Latn
  content: 'This revised and updated “Quick Start” guide is intended to introduce
    potential users to the 1 Sep 2024 version of the CCQM_Retrospectoscope system.
    The CCQM_Retrospectoscope system combines a database of results from Consultative
    Committee for the Amount of Substance: Metrology in Chemistry and Biology (CCQM)
    studies with a number of graphical tools for trying to make sense of the data.
    The CCQM_Retrospectoscope system supports fairly comprehensive and potentially
    novel appraisals of participation and measurement performance throughout the history
    of the CCQM activities. The appraisals include the bias, uncertainty, and degrees
    of equivalence of results submitted by individual national metrology or designated
    institutes (NMI/DIs); the relative performance of NMI/DIs, and the uncertainty
    function characteristic of entire Working Groups (WGs).'

abstract:
- language: en
  script: Latn
  content: The United States (US) faces significant challenges in maintaining and
    modernizing its aging infrastructure, particularly in the transportation sector,
    which includes roadways, bridges, rail, air, ports, and pipelines. Infrastructure
    vulnerabilities continue to be exacerbated by maintenance backlogs, inefficient
    resource allocation, and increasing risks from natural hazards and extreme weather
    events. In response, recent initiatives have sought to enhance infrastructure
    resilience, including the Functional Recovery framework, developed by the National
    Institute of Standards and Technology (NIST) and the Federal Emergency Management
    Agency (FEMA), which establishes recovery-based objectives to improve post-disaster
    performance of lifeline infrastructure systems. Building on this evolving landscape,
    this report introduces a first-generation decision-support framework, TRIP$ (Transportation
    Risk/Recovery Investment Planning Solutions). TRIP$ integrates developments for
    highway infrastructure resilience with advanced methodologies for risk assessment
    and resilience-based investment planning. Initially focused on earthquake resilience
    of highway infrastructure, the modular framework can incorporate multiple hazards,
    such as flood, and be adapted to other lifeline systems. An end-to-end technical
    implementation focused on the seismic resilience of US highway bridge portfolios
    illustrates the framework’s scope, functionality, and potential applications.
    The report concludes with a discussion of limitations, ongoing research, and future
    development directions.

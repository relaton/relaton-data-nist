abstract:
- language: en
  script: Latn
  content: This Data Collection Instrument (DCI) publication outlines the development
    and application of a survey to study the differences between risk preferences
    of an individual making choices at the individual and community levels. Individuals
    and communities have different ideas about what risks they might be willing to
    take. When it comes to risk-taking, every individual has a different level of
    comfort, based on their unique experiences and values. Similarly, communities
    also have their unique attitudes towards risks based on those they serve and the
    constraints the community faces, as well as planning preferences. Consider a community
    planning a new park. Some residents might welcome the change, seeing it as an
    opportunity for recreation and socializing. Others might worry about increased
    traffic or noise and ultimately be more risk averse. Typically, community-level
    decisions may be made by an individual or a collaborative planning team on behalf
    of a larger community. Such decision makers may have personal risk preferences,
    but hold different concerns when making a community resilience decision on behalf
    of the community. This study helps us understand whether the decision-maker’s
    risk preference differs when they are making an individual-focused decisions versus
    when an entire community considered. Understanding these differences helps us
    create better plans for keeping communities safe and strong.

abstract:
- language: en
  script: Latn
  content: Over the past 50 years, the National Institute of Standards and Technology
    (NIST) has effectively fulfilled its responsibilities under the Federal Fire Prevention
    and Control Act of 1974. For 70 years prior to that, the National Bureau of Standards
    (NBS), renamed NIST in 1988, was a pioneer in fire safety and fire science. The
    highlights described in this publication were selected to showcase technically
    diverse areas of NIST fire research that have advanced fire science and have led
    to, or are in the process of leading to, a substantial increase in fire safety
    in the United States.

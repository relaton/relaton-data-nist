abstract:
- language: en
  script: Latn
  content: National Institute of Standards and Technology (NIST) and U.S. Army Engineer
    Research and Development Center (ERDC), brought together key players from the
    additive construction (AC) industry to tackle the urgent need for standardized
    guidelines. The discussions focused on the development of standards for materials
    testing, structural integrity, and safety protocols specific to 3D-printed structures.
    Central to the workshop discussions was the creation of performance-based standards
    to ensure reliability and safety in various construction applications, from housing
    to large-scale infrastructure. The workshop emphasized the importance of collaboration
    among industry leaders, researchers, and government bodies to close gaps in current
    standards and bring domestic codes in line with international ones. Additive construction's
    potential to reduce material waste, streamline processes, and enhance sustainability
    was a recurring theme, along with the need for clear, adaptable standards to support
    innovation without compromising safety. Challenges related to real-world applications
    and workforce development were also explored. Through a series of sessions and
    discussions, participants outlined key obstacles and offered solutions to help
    advance standardization efforts in the AC field. The workshop participants underscored
    the importance of continued cooperation, data-driven progress, and developing
    flexible standards that evolve with advancing technology.

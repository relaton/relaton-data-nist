abstract:
- language: en
  script: Latn
  content: Internal crack formation and propagation are often found in concrete undergoing
    expansion of some internal phase or phases, driven by deterioration mechanisms
    such as pyrrhotite oxidation or alkali-silica reaction. This study employs a 2-D
    finite element-based coarse-grained quasistatic approach to model crack formation
    and propagation when selected internal phases expand. Idealized cases of composite
    materials are first analyzed. The computational model is then applied to microstructure
    images of cement-based materials to demonstrate its effectiveness. This model
    enables the testing of various hypotheses regarding internal degradation mechanisms
    in composite materials, aiding in the development of a conceptual framework and
    identifying key elements of degradation. An analysis of crack initiation site
    location, number, and size was conducted, and crack propagation simulations were
    generated. A semi-empirical relationship between mechanical properties and crack
    area was proposed. This 2-D model provides a valuable tool to help understand
    internal cracking due to various deterioration mechanisms driven by expansive
    material phases.

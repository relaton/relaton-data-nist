abstract:
- language: en
  script: Latn
  content: The metric system (International System of Units, SI) is easy to use and
    learn. The Metric System Estimation Game is a fun, hands-on activity that helps
    participants become familiar with SI measurements by practicing estimation skills.
    During this activity, participants will become familiar with using metric (SI)
    measurements on common everyday items. About how many grams does a baseball weigh?
    Approximately how many centimeters long is a pencil? How many liters are in that
    water bottle? Participants will work in small groups and earn points during this
    interactive, hands-on measurement game. With multiple game variations, the activity
    may be differentiated for instructional and skill levels.

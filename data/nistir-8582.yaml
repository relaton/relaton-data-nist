abstract:
- language: en
  script: Latn
  content: Supply chain challenges and health concerns have spurred the development
    of new Co-free, Cr-containing maraging steels with several new alloys already
    commercialized. These alloys are a less expensive and more sustainable form of
    the currently used Co-containing maraging steels C300 and C350. However, Co-free,
    Cr-containing maraging steels exhibit reduced strengths after heat treatment compared
    to current Co-containing alloys. New processing pathways are required to create
    microstructures able to reach parity with existing Co-containing or Ti-strengthened
    maraging steels and enable their replacement with sustainable alternatives. This
    work looks at using changes to laser beam powder bed fusion (PBF-LB) build parameters
    of the Co-free, Cr-containing maraging steel M789 to alter the as-built microstructure
    and provide new avenues for reaching parity with existing Co-containing maraging
    steels. Modelling of the PBF-LB build process suggests considerable changes in
    thermal history, and thereby likely unique evolution in solidification and solid
    state microstructures. Characterization of as-built material however showed little-to-no
    impact of build parameters on the solid state or solidification microstructures,
    suggesting M789 and other alloys experience phase transformations that are resilient
    to build parameter selection. Differences in porosity content between parameter
    sets obscured any changes in material properties during uniaxial tension and hardness
    testing. Despite these defects, multiple parameter sets produced material with
    as-built tensile strengths comparable to C300 maraging steels, demonstrating M789
    can be a feasible alternative of C300 in as-built material applications. Future
    considerations on using heat treatments and implementing HIP to remove porosity
    defects are discussed as avenues to identify processing routes which boost the
    mechanical properties of M789 and other Co-free, Cr-containing alloys. Future
    work on better understanding the solid state transformations of M789 are also
    discussed, especially with implications on the resilience of this alloy to changes
    in build parameters and the development of other AM-resilient alloys.

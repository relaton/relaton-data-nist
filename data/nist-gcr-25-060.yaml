abstract:
- language: en
  script: Latn
  content: 'RTI International received funding from the National Institute of Standards
    and Technology (NIST) to conduct a study on the retrospective and prospective
    economic impacts of investments in U.S. neutron scattering research facilities
    from 1960 through 2030. This report focusses primarily on quantifying the economic
    returns to investments in the three current U.S. federal neutron scattering facilities
    with broad open user programs: the High-Flux Isotope Reactor (HFIR) and Spallation
    Neutron Source (SNS), both located at Oak Ridge National Laboratory (ORNL), and
    the NIST Center for Neutron Research (NCNR) reactor. This report also provides
    insights on additional infrastructure and policy needs to help the United States
    stay globally competitive moving forward.'

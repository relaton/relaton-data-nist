abstract:
- language: en
  script: Latn
  content: 'NIST Handbook 150-23, NVLAP Homeland Security Applications: Radiation
    Detection Instruments, presents the technical requirements and guidance for the
    accreditation of laboratories that test radiation detection instruments used in
    homeland security applications. The 2010 edition of NIST Handbook 150-23 is the
    result of an extended development period as the program standards and testing
    and evaluation protocols were being developed and finalized.'

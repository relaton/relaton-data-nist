abstract:
- language: en
  script: Latn
  content: Given the increasing prevalence of using Environmental Product Declarations
    (EPDs) for product comparisons and selection, both domestically and globally,
    there is a need to ensure the results reported in EPDs are useful for such comparisons
    (i.e., transparent and standardized to ensure quality decision making). One challenge
    that was identified more than a decade ago was the lack of common data sources,
    which could undermine the comparability of EPDs and similar claims. Federal agencies
    have targeted this issue through the development of public secondary datasets
    and gap assessments of currently available public life cycle inventory (LCI) datasets.
    This study follows the framework for the identification and quantification of
    public data gaps developed and applied to construction materials in NIST TN 2338
    and expanded in and applied to a building system component (photovoltaic panels)
    in NIST TN 2350. This study addresses the final application of one semiconductor,
    a residential photovoltaic system. The LCA models developed in NIST TN 2350 are
    used as the photovoltaic panel components needed in this study to model the entire
    photovoltaic system. The scope of this study is to (1) refine the framework to
    identify public life cycle assessment (LCA) data gaps by evaluating multiple impact
    categories using two impact assessment methods, (2) identify and quantify the
    impact of each data gap of the components of an entire building system (i.e.,
    rooftop residential photovoltaic system), and (3) provide qualitative rankings
    of data gaps both within each stage of the production supply chain and for the
    entire assembled system. The study concludes with a series of recommendations
    to strengthen and further develop public LCI datasets.

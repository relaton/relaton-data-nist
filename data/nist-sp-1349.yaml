abstract:
- language: en
  script: Latn
  content: 'This study uses the Economic Decision Guide Software (EDGe$) Online Tool
    to evaluate a use case involving three potential drought resilience strategies
    in Riverside County, California: 1. urban landscape conversion, 2. stormwater
    capture and reuse, and 3. purple pipe water recycling. The analysis relies on
    publicly available data to compare the costs, benefits (no disaster and disaster-related),
    and externalities of each investment over a 20-year period. Results show that
    urban landscape conversion provides the highest overall return. These findings
    highlight the value of accounting for non-disaster benefits and externalities
    in economic evaluations of resilience projects with a use case addressing slow
    and persistent stressors based on weather extremes (e.g., drought conditions).
    The study shows how tools like Edge$ can support informed decision-making by helping
    communities compare costs and benefits when planning for drought resilience'

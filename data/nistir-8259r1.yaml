abstract:
- language: en
  script: Latn
  content: Internet of Things (IoT) products often lack product cybersecurity capabilities
    their customers—organizations and individuals—can use to help mitigate their cybersecurity
    risks. Manufacturers can help their customers by improving the securability of
    their IoT products by providing necessary cybersecurity functionality and by providing
    customers with the cybersecurity-related information they need. This publication
    describes recommended activities related to cybersecurity that manufacturers should
    consider performing before their IoT products are sold to customers. These foundational
    cybersecurity activities can help manufacturers lessen the cybersecurity-related
    efforts needed by customers, which in turn can reduce the prevalence and severity
    of compromises.

abstract:
- language: en
  script: Latn
  content: Evaluating community resilience planning in the face of natural hazards
    and disasters presents significant challenges, including limited system clarity,
    diverging community priorities, resource constraints, and inherent uncertainties.
    Traditional methods—often reliant on economic metrics through benefit-cost analysis—may
    overlook critical factors. In response, the increasing shift towards transdisciplinary
    methods underscores the importance of integrating local community priorities into
    resilience planning. This research leverages the Community-informed Decisions
    for Efficient, Cost-effective, and Integrative Disaster Resilience planning (Co-DECIDR)
    modeling framework. By merging Fuzzy Cognitive Mapping (FCM), to account for qualitative
    considerations, with Benefit-Cost Analysis (BCA) for quantitative rigor, Co-DECIDR
    enables a comprehensive understanding of complex socioeconomic systems that support
    built and natural infrastructure. The framework can be operationalized via accessible
    online tools—Mental Modeler for FCM and Economic Decision Guide Software (EDGe$)
    for BCA—to enhance user engagement and model efficacy. There is increasing use
    of Natural Language Processing (NLP) and Large Language Models (LLMs) to more
    efficiently populate a baseline dataset for inclusion in modeling frameworks,
    such as Co-DECIDR. This approach is especially promising leveraging human-in-the-loop
    techniques and considering data from the widespread use of multimodal communication
    technologies.

abstract:
- language: en
  script: Latn
  content: In the last several years, the sale and use of cannabis products have been
    legalized in multiple States in the U.S. With this legalization comes the legal
    control over the sale of cannabis products, including weights and measures regulation.
    State and local Weights and Measures jurisdictions in the U.S. are debating which
    requirements should be imposed on scales used for the sale of cannabis products
    and their use. These include aspects such as accuracy, scale division, and auxiliary
    indications, which are subject to discussion within the National Council on Weights
    and Measures (NCWM). The NIST Office of Weights and Measures has taken the initiative
    to provide objective, technical information on the most relevant aspects of weighing
    instruments regarding their suitability for selling cannabis products, which can
    help clarify the discussion. The aim of this publication is to provide technical
    guidance for the decision-making process of determining suitability requirements
    for weighing instruments used for the sale of cannabis products. The aim is not
    to provide a recommendation regarding any proposed technical requirement for a
    scale or its usage

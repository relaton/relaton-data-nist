abstract:
- language: en
  script: Latn
  content: 'This report explores DNA mixture interpretation in six chapters, a bibliography
    of cited references, an appendix with glossary and acronyms, and two supplemental
    documents. Chapter 1 introduces the topic of DNA mixtures, the difficulties behind
    their interpretations, and discusses the relevance of issues explored in the other
    chapters of this scientific foundation review. Chapter 2 provides background information
    on the use of DNA testing in forensic casework and describes principles and practices
    underlying mixture measurement and interpretation. The likelihood ratio (LR) framework
    and probabilistic genotyping software (PGS) are also discussed. Chapter 3 lists
    data sources used in this study and strategies used to locate them. Chapter 4
    and Chapter 5 cover the report’s core concepts: reliability and relevance issues
    in DNA mixture interpretation when seeking to answer “who” and “how” questions
    at the sub-source and activity levels of the hierarchy of propositions, respectively.
    Chapter 6 explores the potential of new technologies to assist in mixture interpretation
    and considerations for implementation. Two supplemental documents provide context
    on how the field has progressed (NISTIR 8351sup1) and summarized information from
    publicly accessible validation and proficiency test results covering DNA mixture
    interpretation (NISTIR 8351sup2). There are 498 references cited in this report.'

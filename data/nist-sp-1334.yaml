abstract:
- language: en
  script: Latn
  content: Though portable storage media are convenient, their unregulated use poses
    cybersecurity risks for organizations utilizing them in their OT environments.
    Procedural, physical, and technical controls are important because they can minimize
    the likelihood of a cyberattack from portable storage media usage. The National
    Cybersecurity Center of Excellence (NCCoE) has developed recommendations to help
    OT personnel use portable storage media securely

abstract:
- language: en
  script: Latn
  content: This report documents the results of the Hurricane Ian Data Synthesis Workshop,
    held on June 6, 2023, at the American Society of Civil Engineers headquarters
    in Reston, Virginia. The purpose of the workshop, which was conducted in collaboration
    between NIST, Oregon State University, and ASCE, was to share information and
    data within the hurricane research community to build awareness of recent, ongoing,
    and planned data collection activities, methods and availability of such data.
    The workshop included presentations by representatives of a dozen governmental
    agencies, academic institutions, and private sector organizations, followed by
    breakout sessions and discussion. The main focus areas of the workshop included
    data sharing on wind and storm surge hazards and building damage. Secondary areas
    of emphasis included quantification of storm-generated debris and data collection
    for studies of hurricane recovery. Workshop participants developed several recommendations
    for data collection and related research in themed areas of natural, built and
    human environments, as well as a few more overarching recommendations. Key among
    those was to foster a more collaborative effort in structuring improved data-sharing
    platforms and holding a second workshop to explore the most challenging measurement
    and data collection problems and share research results.

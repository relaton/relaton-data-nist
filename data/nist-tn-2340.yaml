abstract:
- language: en
  script: Latn
  content: A novel hybrid network combines quantum communications with classical,
    non-quantum, networks to strengthen the security of modern networks. Event detection
    using quantum states as sensors offers a promising method for identifying malicious
    activities of a deployed, dynamic, multi-node network, distinguishing irregular
    physical layer behavior from benign network changes. These quantum-augmented detectors
    are sensitive to network-based threat events like unwanted listeners, route injection,
    and other malicious actions commonly caused by adversaries. However, environmental
    factors - network congestion, interference, and signal fluctuations - can impact
    detection accuracy. These necessitates the use of experimental and evaluation
    strategies to measure the detector’s performance and protocols when they are operating
    within real-world networks. Experimental and evaluation strategies are crucial
    for assessing and advancing these detection methods while maintaining flexibility
    within the detection methodology. Well-designed experiments offer valuable insights
    into the detector performance and response time, which are essential for estimating
    error rates associated with false alarms, missed detections, and misclassifications
    (e.g., threat event misclassification) across various types of threat events.
    The goal of the strategies is to achieve sufficiently low uncertainty in these
    error rate estimates, ensuring the detector operates reliably under different
    network conditions. By incorporating a variety of events, these strategies contribute
    to enhancing detector performance, resulting in robust and adaptive solutions
    for safeguarding modern communication network infrastructures.

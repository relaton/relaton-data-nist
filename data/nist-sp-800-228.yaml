abstract:
- language: en
  script: Latn
  content: 'Modern enterprise IT systems rely on a family of application programming
    interfaces (APIs) for integration to support organizational business processes.
    Hence, a secure deployment of APIs is critical for overall enterprise security.
    This, in turn, requires the identification of risk factors or vulnerabilities
    in various phases of the API life cycle and the development of controls or protection
    measures. This document addresses the following aspects of achieving that goal:
    (a) the identification and analysis of risk factors or vulnerabilities during
    various activities of API development and runtime, (b) recommended basic and advanced
    controls and protection measures during the pre-runtime and runtime stages of
    APIs, and (c) an analysis of the advantages and disadvantages of various implementation
    options for those controls to enable security practitioners to adopt an incremental,
    risk-based approach to securing their APIs.'

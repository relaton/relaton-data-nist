abstract:
- language: en
  script: Latn
  content: The NIST Cybersecurity Framework (CSF) 2.0 can help organizations manage
    and reduce their cybersecurity risks as they start or improve their cybersecurity
    program. The CSF outlines specific outcomes that organizations can achieve to
    address risk. Other NIST resources help explain specific actions that can be taken
    to achieve each outcome. This guide is a supplement to the NIST CSF and is not
    intended to replace it.

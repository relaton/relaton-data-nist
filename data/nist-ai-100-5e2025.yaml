abstract:
- language: en
  script: Latn
  content: This plan has been developed by the Department of Commerce in coordination
    with the Department of State and agencies across the U.S. Government. It reflects
    more than 65 comments received in response to a December 2023 Request for Information.
    Multistakeholder listening sessions covering multiple sectors were held with representatives
    of federal and non-U.S. governments, businesses, academia, and civil society,
    which provided further input and comments. These inputs were reviewed and combined
    with insights from across NIST, other agencies in the Department of Commerce,
    the Department of State, United States Agency for International Development, and
    other departments and agencies into an initial public draft, released in April
    2024 for public comment. The July 2024 version was revised from the initial public
    draft based on the 57 comments received; this document includes subsequent editorial
    changes. This April 2025 version reflects minor editorial updates.

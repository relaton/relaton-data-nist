abstract:
- language: en
  script: Latn
  content: A simple theory on fuel ignition by firebrands was developed based on the
    ignition criteria ofthe Semenov thermal theory. Two dimensionless parameters were
    identified and used todemarcate the ignition and non-ignition regions in an ignition
    regime map. The parametersfrom the ignition and non-ignition states were used
    as input to numerically solve the governingenergy balance to obtain the dimensionless
    transient temperature profile in the fuel layer,which was used to verify if ignition
    or thermal runaway occurred and to determinedimensionless ignition time

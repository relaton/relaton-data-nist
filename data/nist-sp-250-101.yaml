abstract:
- language: en
  script: Latn
  content: The National Institute of Standards and Technology performs calibrations
    of spectral reflectance measurements in the ultraviolet (UV) to short-wave infrared
    (SWIR) spectral regions using the Robotic Optical Scattering Instrument (ROSI)
    and its associated Reference Integrating Sphere (RIS). This special publication
    gives a comprehensive overview of the design, operation, and capabilities of this
    facility. Measurement methods for spectral reflectance, the elements of the uncertainty
    budget, and validation of the reflectance scale through comparison with NIST’s
    previous reference instrument, the Spectral Tri-function Automated Reference Reflectometer
    (STARR), are described. Examples of calibration measurements, including specular
    reflectance of mirrors, bidirectional reflectance of diffuse reflectors, and directional-hemispherical
    reflectance, are given. Examples of typical calibration reports are also provided.

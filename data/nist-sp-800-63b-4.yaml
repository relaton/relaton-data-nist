abstract:
- language: en
  script: Latn
  content: This guideline focuses on the authentication of subjects who interact with
    government information systems over networks to establish that a given claimant
    is a subscriber who has been previously authenticated. The result of the authentication
    process maybe used locally by the system performing the authentication or asserted
    elsewhere in a federated identity system. This document defines technical requirements
    for each of the three authentication assurance levels. The guidelines are not
    intended to constrain the development or use of standards outside of this purpose.
    This publication supersedes NIST Special Publication (SP) 800-63B

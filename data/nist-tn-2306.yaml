abstract:
- language: en
  script: Latn
  content: Electric vehicles are often considered one of the best ways to decarbonize
    transportation within the United States. This report reviews the battery electric
    vehicle adoption literature, focusing on the drivers and barriers to adoption.
    The first section outlines critical trends in battery electric vehicle adoption
    and background information about the market for electric vehicles in the United
    States. The second section focuses on the drivers and barriers to adoption of
    battery electric vehicles with emphasis on drivers and barriers relevant to the
    battery of a battery electric vehicle. The third section then details additional
    technical papers on the batteries of electric battery vehicles, including options
    for the end of use of the battery. The battery of an electric vehicle is one of
    the most expensive components, and the technology in batteries is evolving quickly,
    so we focus our review on papers related to the batteries of battery electric
    vehicles.

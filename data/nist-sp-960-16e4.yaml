abstract:
- language: en
  script: Latn
  content: Fractography is a powerful but underutilized tool for the analysis of fractured
    glasses and ceramics. It may be applied to fractures in the laboratory or for
    component failures in service. Fractography can identify the cause of failure
    and can even provide quantitative information about the loading conditions. The
    goal of this Guide is to make fractographic analysis of brittle materials less
    an art and more an engineering practice for scientists and engineers. This Guide
    is a free public service of NIST for the benefit of American industry, and the
    worldwide ceramic and glass communities.

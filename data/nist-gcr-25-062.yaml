abstract:
- language: en
  script: Latn
  content: The focus of our analysis was on the estimation of the economic benefits
    of GPS to the U.S. private sector. We provide estimates from two perspectives.
    First, we quantified the value of GPS relative to alternative technologies and
    systems for the period from 1984 to 2017. Second, we estimated what the potential
    impacts would be if a GPS outage were to occur today. Our analysis combined insights
    from nearly 200 experts in the use of GPS for specific applications, surveys of
    professional surveyors and smartphone users, economic modeling tools, and national
    statistics. Benefits comprise productivity gains from new and existing products
    and services, improvements in quality, increases in personal enjoyment, and environmental
    and public health impacts.

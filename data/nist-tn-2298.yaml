abstract:
- language: en
  script: Latn
  content: In the U.S., commercial buildings are responsible for approximately 36
    % of total energy consumption, and the heating, ventilation, and air-conditioning
    (HVAC) systems make up about 52 % of that total. Improving building operations
    can significantly reduce the amount and cost of the energy used in the commercial
    building sector. The Intelligent Building Agents Laboratory (IBAL) at the National
    Institute of Standards and Technology (NIST) was designed to emulate the air and
    hydronic systems in a small commercial building primarily to develop and study
    advanced control approaches for HVAC systems. This report focuses on the calibration
    and validation of a simulation tool that couples a model of the IBAL with a virtual
    building model. That tool, IBASIM, will be used to quickly evaluate different
    control approaches before selecting and implementing the most promising approaches
    in the IBAL

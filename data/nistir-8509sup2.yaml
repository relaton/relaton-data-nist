abstract:
- language: en
  script: Latn
  content: 'This report provides supplemental information to NISTIR 8509 Footwear
    and Tire Impression Examination: A NIST Scientific Foundation Review. This report
    summarizes the concerns and critiques raised about footwear and tire impression
    examination by various groups including the National Research Council and the
    President’s Council of Advisors on Science and Technology. Responses given by
    members of the footwear and tire impression examination community are also summarized.'

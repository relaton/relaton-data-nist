abstract:
- language: en
  script: Latn
  content: High-performance computing (HPC) systems provide fundamental computing
    infrastructure for large-scale and complex simulations, big data analysis, and
    the training of artificial intelligence (AI) and machine learning (ML) models,
    all at exceptional speeds. Securing HPC systems is essential to safeguard AI models,
    protect sensitive data, and realize the full benefits of HPC. The HPC system utilizes
    specialized hardware, software, and high-speed networks within intricate user
    environments, and high performance is a fundamental requirement of the system.
    This NIST Special Publication introduces an HPC security overlay designed to address
    these unique security characteristics and requirements. Built on the moderate
    baseline defined in NIST SP 800-53B, the overlay tailors 60 security controls
    from NIST SP 800-53 with supplemental guidance and/or discussion to enhance their
    applicability in HPC contexts. This overlay aims to provide practical, performance-conscious
    security guidance that can be readily adopted. For many organizations, it offers
    a robust foundation for securing HPC environments while also allowing for further
    customization to meet specific operational or mission needs. This document is
    intended for use by IT security managers, compliance officers, HPC system administrators,
    and agency program managers responsible for securing HPC environments.

abstract:
- language: en
  script: Latn
  content: The latest protocols are described for the NIST assignment of fluorescence
    intensity to calibration spheres or beads, which are used primarily for the accurate
    measurement of particle intensity in quantitative flow cytometry. Procedures for
    measuring fluorescence intensity and bead concentration are described and the
    history of these assignments for the NIST Flow Cytometry Standards Consortium
    and its members are reviewed.

abstract:
- language: en
  script: Latn
  content: 'In 2018 in conjunction with the National Institute of Justice (NIJ), the
    National Institute ofStandards and Technology (NIST) assembled a group of multidisciplinary
    experts, theEvidence Management Steering Committee (EMSC), to develop a plan to
    (1) providerecommendations for the retention, preservation, integrity, and disposition
    of evidence andproperty and (2) encourage the adoption of practice improvements,
    through education andengagement, of the broad community of U.S. justice system
    stakeholders involved inevidence management. The EMSC oversaw four major activities:
    an evidence managementsurvey (NIST SP 1500-33B), a review of existing literature
    in forensic evidence management(this bibliography); a stakeholder workshop; and
    the dissemination of findings from theseactivities (NIST SP 1500-33A and https://doi.org/10.18434/mds2-3834,
    which provides thesurvey data).'

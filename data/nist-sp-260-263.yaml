abstract:
- language: en
  script: Latn
  content: The National Institute of Standards and Technology (NIST) Standard Reference
    Material® (SRM®)2921a Human Cardiac Troponin Complex delivers a certified value
    for the concentration of human cardiac troponin I in a solution of the human cardiac
    troponin complex and the associated uncertainty of the certified value. The material
    is intended for 1) use in validating measurement procedures and 2) use in qualifying
    control materials produced in-house and analyzed using measurement methods for
    the determination of the concentration of human cardiac troponin Iin human blood
    samples. A unit of SRM 2921a consists of three (3) vials of a frozen aqueous solution
    of human cardiac troponin complex. This publication documents the production,
    measurement processes, results, and statistical evaluations involved in the production
    and certification of SRM 2921a

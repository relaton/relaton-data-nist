abstract:
- language: en
  script: Latn
  content: 'The National Institute of Standards and Technology (NIST) operates the
    Community Resilience Program (CRP) to help communities and stakeholders develop
    resilience and recovery solutions by focusing on the nexus of buildings, built
    infrastructure systems, and their supporting socioeconomic functions. Through
    science-based tools, guidance, and metrics, NIST aims to empower communities to
    improve their ability to prepare for, withstand, and recover from acute shocks,
    chronic stressors, and compound impacts. The Community Resilience Assessment Methodology
    Products project develops the tools for communities to quantitatively assess their
    resilience over time. This assessment is based on a comprehensive suite of community
    resilience indicators that capture essential elements of physical, social, and
    economic systems. Research areas include, but are not limited to: indicator validation
    studies, methods for downscaling indicators, and identifying actions that influence
    resilience outcomes. To support this work, tools have been developed and are available
    to the research team: 1) Inventory of Community Resilience Indicators & Assessment
    Frameworks and 2) Tracking Community Resilience (TraCR) database.'

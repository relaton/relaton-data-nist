abstract:
- language: en
  script: Latn
  content: The Software Assurance Reference Dataset (SARD) has over 450 000 buggy
    programs in five languages covering more than 150 classes of weaknesses. We describe
    the principles of the collection and the very diverse content. We explain how
    to search and access the programs and the rich documentation and web pages associated
    with the SARD.

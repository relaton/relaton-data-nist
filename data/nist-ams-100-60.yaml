abstract:
- language: en
  script: Latn
  content: Additive manufacturing is a complex and inherently digitally orientated
    manufacturing technology. This technology has become popular as it offers certain
    benefits when compared with traditional manufacturing technologies such as the
    ability to produce unique and complex geometries, reduced turnaround time from
    design to final product, reduced material waste, and the ability to process a
    wide range of materials. There are however challenges to the qualification and
    industrialization on this technology. These include the potential variability
    in both inputs and outputs, control of the many variables and process parameters,
    and the lack of process understanding, guidance material, and the steep learning
    curve for new users. This report proposes a reference activity model that defines
    generic activities and data items across the additive manufacturing workflow,
    from design through to part evaluation. The reference activity model is modeled
    in accordance with the IDEF0 language. Data items are defined and mapped against
    industry standards to provide users with the required information to develop their
    specific production processes and controls. This model aims to improve additive
    manufacturing product and production data exchange and detail a reference architecture
    for the development of digital twins and threads.

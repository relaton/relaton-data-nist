abstract:
- language: en
  script: Latn
  content: 'Beginning with the Second Industrial Revolution, the US economy grew to
    become the world’s leader by doing the one thing that drives long-term increases
    in incomes: investing in productivity growth. This productivity impact of this
    investment was realized through the creation of new technologies that were then
    embodied in new types of equipment creating new products at lower cost. The country
    also invested in educating its workers to use these technologies efficiently.
    And finally, substantial public investment was undertaken, which created a world-class
    infrastructure that leveraged the efficiency of commerce.'

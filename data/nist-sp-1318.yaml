abstract:
- language: en
  script: Latn
  content: This introductory guide provides small businesses with a high level overview
    of NIST Special Publication (SP) 800-171 Revision 3, Protecting Controlled Unclassified
    Information in Nonfederal Systems and Organizations. The document is broken up
    into two separate sections. The first few pages provide a general overview tailored
    to business leaders or those new to SP 800-171 R3 The second section is written
    for those who are tasked with implementing the security requirements in SP 800-171
    R3 (whether doing it themselves or engaging a vendor), or those who want to gain
    an introductory understanding of each of the control families. This primer is
    not all-encompassing and serves as a bridge to the larger SP 800-171 R3 publication.
    The guide includes an overview of SP 800-171 R3, frequently asked questions, tips
    for getting started, related resources, definitions and examples, and more.

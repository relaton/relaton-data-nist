abstract:
- language: en
  script: Latn
  content: The National Institute of Standards and Technology (NIST) Standard Reference
    Material®(SRM®) 3223 Inorganic Constituents in Cigarette Tobacco Filler is intended
    for use in the validation of procedures and methods for the determination of inorganic
    constituents in cigarette tobacco filler or similar matrices. Air-cured low-nicotine
    tobacco was processed commercially using the normal procedures used for the production
    of cigarette tobacco filler. The product was cryogenically milled, irradiated,
    and packaged into individual SRM units. Value assigned measurements were made
    collaboratively at the Centers for Disease Control and Prevention (CDC) and NIST.
    This publication documents the production, analytical measurements, and statistical
    evaluations leading to the certification of the SRM.

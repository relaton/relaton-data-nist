abstract:
- language: en
  script: Latn
  content: This report studies the cryptographic random number generation standards
    and guidelines written by BSI and NIST, namely AIS 20/31 and the SP 800‐90 series.
    The aim of this report is to compare these publications, focusing on the similarities
    and differences of their terminology, assumptions, and requirements. This report
    also aims to improve the communications between all involved parties, promote
    a shared understanding, and reduce and resolve inconsistencies in related standards.

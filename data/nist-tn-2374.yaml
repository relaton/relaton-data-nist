abstract:
- language: en
  script: Latn
  content: 'Assessing embodied carbon can drive innovation in materials, structural
    systems, and design practices that strengthen both disaster resilience and resource
    efficiency. This project aims to enhance the industry''s capacity to assess the
    embodied carbon of resilient buildings by delivering a new method and tool. This
    can improve the competitiveness of U.S. industry in the global market. Pelicun
    is an open-source software package developed by the Natural Hazards Engineering
    Research Infrastructure’s (NHERI) Computational Modeling and Simulation Center
    (SimCenter) to evaluate building damage and losses resulting from natural hazard
    events. Based on the Pelicun framework, we develop a Python library, Pelicun-LCA,
    which utilizes a hybrid method to probabilistically quantify the embodied carbon
    associated with post-disaster building repairs. This method considers the direct
    impact of repair materials and the indirect impact of repair processes, including
    construction equipment, labor travel, debris disposal, and occupant displacement.
    This method combines detailed process analysis with comprehensive input-output
    analysis to improve the accuracy and completeness of carbon assessments. However,
    due to its added complexity and substantial computational workload, automated
    calculation tools are essential for practical application. This report presents
    the technical details of Pelicun-LCA, a tool that streamlines the probabilistic
    assessment of embodied carbon in post disaster building repairs. Pelicun-LCA has
    three key features: detailed embodied carbon breakdowns, built-in design databases
    for various building archetypes, and parallel processing for cross-building comparisons.
    Eighteen design variants targeting different seismic performances are examined
    to demonstrate the capabilities of Pelicun-LCA. Finally, this report discusses
    the potential applications and limitations of Pelicun-LCA to help users develop
    effective case studies'

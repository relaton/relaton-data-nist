abstract:
- language: en
  script: Latn
  content: The laminar burning velocities of were measured for Trans-1,2-dichloroethylene
    (DCE), Perfluorobutylethylene (PFBE), a DCE/PFBE of 0.77/0.723 mass fractions
    , a DCE/PFBE blend of 0.60/0.40 mass fraction, 1,1-difluoroethane (HFC-152a),
    and C2H5F (vinyl fluoride). Two methods were developed for the measurements. In
    the first, a Mache-Hebra nozzle burner produces a premixed, conical, Bunsen-type
    flame, from which the average burning velocity is determined from quotient of
    the total flow and the Schlieren image area. In the second method, based on the
    work of Powling and Egerton, a flat flame is stabilized between a honeycomb matrix
    and a wire mesh screen, and the average burning velocity is determined from the
    visible flame diameter and the total flow.

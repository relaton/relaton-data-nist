abstract:
- language: en
  script: Latn
  content: 'The building and construction sector is the largest carbon emitter, accounting
    for more than one-third of annual global emissions. The emissions can be divided
    into operational and embodied carbon, associated with building operations and
    building materials, respectively. To achieve carbon neutral buildings, both operational
    and embodied carbon should be minimized throughout a building’s life cycle. However,
    most climate research and action focus on minimizing operational carbon, while
    efforts to reduce embodied carbon have lagged. In this article, we review the
    methodologies used to assess embodied carbon emissions at each life cycle stage
    of a building. We compare the databases and tools designed for life cycle assessments
    (LCA) and examine the case studies that evaluate carbon reduction strategies.
    Four strategies are reviewed in this article: resilient design, structural retrofits,
    frame selection, and material specification. In addition, we identify areas of
    insufficient knowledge and outline future research needs for embodied carbon assessment
    and reduction. Finally, we provide an overview of international standards and
    building codes related to the embodied carbon of buildings. Overall, this review
    offers valuable guidance and insights to support ongoing decarbonization efforts
    in the building sector. By highlighting innovative strategies and best practices,
    it provides a useful resource for industry experts, policy makers, and researchers
    seeking to reduce carbon emissions and mitigate climate change.'

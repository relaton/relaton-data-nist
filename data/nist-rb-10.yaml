abstract:
- language: en
  script: Latn
  content: The National Institute of Standards and Technology (NIST) manages the Community
    Resilience Program (CRP), which assists communities and other interested and affected
    parties on developing solutions for resilience and recovery at the nexus of buildings
    and built infrastructure systems and the socioeconomic functions they support.
    The CRP, part of NIST’s broader disaster resilience work, complements efforts
    by others in the public and private sectors. By providing science-based tools,
    guidance, and metrics, NIST seeks to empower communities to better prepare for,
    withstand, and recover from acute shocks, chronic stressors, and compound impacts.
    The Community Resilience Systems Modeling project develops tools designed to assist
    communities in identifying viable community-scale resilience plans. The tools
    address specific challenges related to the breadth, large scale, and interdependencies
    of the community resilience planning system—those elements of our physical, social,
    and economic systems that determine a community’s resilience.

abstract:
- language: en
  script: Latn
  content: The Water and Wastewater Systems (WWS) sector plays an important role in
    our national critical infrastructure in supplying clean water to our communities
    and removing harmful materials from wastewater. The WWS sector is undergoing a
    digital transformation, increasing its dependence on connectivity to systems that,
    for instance, monitor pumping stations, evaluate water quality, or analyze data
    to support more efficient operations and improve service. This increased reliance
    on an internet-connected ecosystem, however, increases the opportunity for malicious
    actors to introduce vulnerabilities into a water or wastewater utility’s systems
    and networks. It is important that the water utilities are equipped with resources
    to help them address and mitigate their cybersecurity risks. The NCCoE project,
    “Cybersecurity for the Water and Wastewater Sector” is intended to demonstrate
    practical solutions for the water and wastewater utilities of all sizes to mitigate
    cybersecurity risks. This publication describes the build architecture and provides
    three reference designs that demonstrate secure remote access solutions using
    commercially available technologies.

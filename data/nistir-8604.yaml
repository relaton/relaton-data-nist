abstract:
- language: en
  script: Latn
  content: The National Institute of Standards and Technology (NIST) has constructed
    a discrete manufacturing workcell to support its operational technology (OT) and
    critical infrastructure research. This work is an improvement on the “Collaborative
    Robotics Testbed” that has been in-use by NIST for almost ten years, and described
    in the report NIST IR 8089. The primary intent of the workcell is to emulate a
    real-world discrete manufacturing system as closely as possible without replicating
    an entire manufacturing production line or facility. This paper describes the
    goals, objectives, design, implementation, measurement systems, and operational
    use of the workcell in support of NIST’s research mission, specifically in the
    topics of cybersecurity, digital twins, supply chain traceability, and industrial
    artificial intelligence.

abstract:
- language: en
  script: Latn
  content: This report summarizes the discussion at the April 2025 “Cyber AI Profile
    Workshop” in which NIST sought feedback toward the development of a NIST Cybersecurity
    Framework Community Profile for AI. The Cyber AI Profile will provide guidelines
    for managing cybersecurity risk related to AI systems and security capabilities.
    Discussions at the workshop explored questions and comments received based on
    the Cybersecurity and AI Workshop Concept Paper.

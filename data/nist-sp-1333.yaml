abstract:
- language: en
  script: Latn
  content: This document contains provisions for the design and detailing of fiber
    reinforced polymer (FRP) systems used to jacket concrete columns in seismic retrofit
    applications. Provisions to determine load-deformation parameters used for linear
    and nonlinear analysis of retrofitted columns are presented. Modeling parameters
    and acceptance criteria for concrete columns jacketed using FRP systems are provided
    in a format that allows their evaluation within the ASCE/SEI 41 and ACI 369.1
    frameworks. The provisions of this document are not intended to be used outside
    the framework of ASCE/SEI 41 and ACI 369.1. Only carbon and glass FRP systems
    are treated in this document.

abstract:
- language: en
  script: Latn
  content: 'This document is a detailed reference manual for the 1-September-2024
    version of the CCQM_Retrospectoscope system. The CCQM_Retrospectoscope combines
    a nominally complete database of results from Consultative Committee for the Amount
    of Substance: Metrology in Chemistry and Biology (CCQM) studies with a number
    of graphical tools for trying to make sense of the data. CCQM_Retrospectoscope
    supports a diverse collection of sometimes eye-opening appraisals of participation
    and measurement performance throughout the history of CCQM activities. The appraisals
    include the bias, uncertainty, and degrees of equivalence of results submitted
    by individual national metrology or designated institutes (NMI/DIs); the relative
    performance of NMI/DIs, and the uncertainty function characteristic of entire
    Working Groups (WGs). The CCQM_Retrospectoscope is implemented in Excel using
    Microsoft Visual Basic for Applications (VBA) programs. It runs on both Windows
    and Macintosh platforms.'

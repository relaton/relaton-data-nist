abstract:
- language: en
  script: Latn
  content: 'This Data Collection Instrument (DCI) establishes a guideline and survey
    framework for quantifying consumer preferences and willingness-to-pay (WTP) for
    commodities that containing recycled plastic. The instrument combines behavioral
    experience metrics, attitudinal scales, and a Discrete Choice Experiment (DCE).
    The DCE employs a multi-dimensional split-sample design that varies across three
    critical axes: (1) product context, contrasting low-cost discretionary items (phone
    cases) with high-cost functional goods (sneakers); (2) valuation methodology,
    comparing baseline attribute-based valuations against information treatment valuations;
    and (3) the information framing, which provides respondents with external data
    showing either a significant decrease or increase in the energy required for production.
    By isolating the causal effect of sustainability disclosures through a within-subject
    "information shock" mechanism, this research estimates how stated preferences
    and WTP for attributes associated with recycled plastic products shift after information
    is provided. Beyond the expected empirical findings, this DCI provides a reproducible
    methodological blueprint for researchers and practitioners, enhancing the reliability
    of stated preference studies for emerging circular economy technologies. Additionally,
    this DC contains a series of questions aimed at validating that the data is from
    human subjects rather than synthetic data.'

abstract:
- language: en
  script: Latn
  content: On April 25, 2023, the National Institute of Standards and Technology (NIST)
    hosted a one-day hybrid workshop focused on bringing together organizations and
    working groups with the common goal of enabling validation and implementation
    of rapid microbial testing methods (RMTMs). The purpose of this workshop was to
    identify opportunities to leverage and coordinate ongoing and future efforts on
    RMTMs to accelerate their adoption for advanced therapy products. Based on workshop
    feedback, future areas of focus for the RMTM community to consider addressing
    include the need for data sharing – either via existing or new (e.g., interlaboratory
    study) datasets; increased awareness of existing regulatory and compendial initiatives,
    best practices, reference materials, and resources; and tools and measurement
    assurance strategies to advance the use of molecular-based RMTMs (such as next
    generation sequencing (NGS) and polymerase chain reaction (PCR). Increased collaborative
    efforts in these and other areas will promote the use of RMTMs and support improved
    safety for advanced therapy products.

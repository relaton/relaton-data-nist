abstract:
- language: en
  script: Latn
  content: In situ burning of oil spills has been shown to be a rapid means of removing
    oil from the water surface. Although fresh oil is usually easily ignited, the
    ability to ignite weathered oils and water-in-oil emulsions is less certain. This
    paper presents results from laboratory experiments that measure the ignition times
    for oils and emulsions when heated by thermal radiation. Measurements of thermal
    radiation for diesel fuel pool fires of various sizes likely to be used for oil
    spill ignition are combined with the laboratory measurements of ignition times
    to provide a guide for ignition of weathered and emulsified oils under no wind
    conditions.

abstract:
- language: en
  script: Latn
  content: This document presents a taxonomy for key performance indicators (KPIs)
    tailored to the public and infrastructure sectors. It outlines and applies an
    approach to classify KPIs, aiming to enhance the accuracy and utility of performance
    measurement in these sectors. Through an iterative taxonomy development process,
    it addresses the structural determinants of transaction costs that impact the
    accessibility and analytical utility of KPIs. The document serves as a resource
    for economists, social scientists, and decision-makers, facilitating informed
    decisions and improvements in public and infrastructure services. This taxonomy
    not only aids in navigating the complexities of KPI application but also promotes
    standardization and effective communication across government organizations and
    communities. The development and implications of this taxonomy are demonstrated
    using actual data from Portland, Oregon, reflecting its potential to be adapted
    and applied to different contexts within public and infrastructure sector performance
    measurement.

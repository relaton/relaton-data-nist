abstract:
- language: en
  script: Latn
  content: NIST launched a Cannabis Laboratory Quality Assurance Program (CannaQAP)
    in 2020 to assist laboratories in demonstrating and improving cannabis (hemp and
    marijuana) measurement comparability and competence. CannaQAP provided tools that
    allowed analysts and laboratories to assess how their in-house methods perform
    relative to the community and to an accepted value. This study in Exercise 3 of
    CannaQAP focused on the determination of moisture in one hemp material provided
    by NIST. This report provides a detailed description of the results of this study.
    The wide range of moisture content reported by participating laboratories using
    several different drying methods indicates the need for consistent hemp drying
    method(s) for accurate and precise measurements.

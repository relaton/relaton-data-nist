abstract:
- language: en
  script: Latn
  content: 'In 2018 in conjunction with the National Institute of Justice (NIJ), the
    National Institute of Standards and Technology (NIST) assembled a group of multidisciplinary
    experts, the Evidence Management Steering Committee, to develop a plan to (1)
    provide recommendations for the retention, preservation, integrity, and disposition
    of evidence and property and (2) encourage the adoption of practice improvements,
    through education and engagement, by the broad community of U.S. justice system
    stakeholders involved in evidence management. The committee oversaw four major
    activities: an evidence management survey (NIST SP 1500-33B);a review of existing
    research on evidence management (NIST SP 1500-33C); a stakeholder workshop; and
    preparation of this document. Additionally, the dataset that serves as the basis
    of the committee’s findings in the aforementioned reports has been published at
    https://doi.org/10.18434/mds2-3834.'

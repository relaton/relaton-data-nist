abstract:
- language: en
  script: Latn
  content: 'This report summarizes the second Hurricane Ian workshop, held on March
    17 and 18, 2025, in Fort Myers, Florida. This second Ian workshop focused on the
    state of research for coastal surge and wave hazards and impacts on the built
    environment. Participants highlighted lessons learned and technologies developed
    or leveraged for reconnaissance efforts. Novel experimental campaigns and numerical
    model simulations were also presented, sharing integrated approaches to capture
    primary and cascading hazards and preliminary work applying these to interactions
    with the built environment. A common thread was found using Fort Myers Beach as
    a test bed to communicate the urgency and importance for collaborative approaches,
    to share data and information among agencies, researchers, practitioners, and
    to develop better understanding of model capabilities for prediction storm impacts
    from coastal surge and waves. The report concludes with strategies to be considered
    and potential avenues for future research including: the exploration and continued
    development of new technologies (e.g., sensors), methods for capturing data (e.g.,
    surveys), continued testing either in a laboratory (e.g., scaled hurricane surge
    experiment), or in-situ opportunities (e.g., Rodanthe testbed).'

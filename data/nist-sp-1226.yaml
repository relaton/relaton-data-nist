abstract:
- language: en
  script: Latn
  content: 'The 102nd Annual Meeting of the National of the National Conference on
    Weights and Measures (NCWM) was held July 16-20, 2017, at the Omni William Penn
    Hotel, Pittsburgh, Pennsylvania. The theme of the meeting was Tradition and Technology:
    Finding the Right Balance. Reports by the NCWM Board of Directors, Standing Committees,
    and Special Purpose Committees constitute the major portion of this publication,
    along with the addresses delivered by Conference officials and other authorities
    from government and industry. Special meetings included those of the Meter Manufacturers
    Association, Packaging and Labeling Subcommittee, Fuels and Lubricants Subcommittee,
    Associate Membership Committee, Regional Association Meetings, Multipoint Calibration
    Task Group and Weigh-in-Motion Task Group.'

abstract:
- language: en
  script: Latn
  content: Standard Reference Material (SRM) 1989 is a NIST particle standard produced
    using photolithographic methods and delivers a certified value for particle size
    of an irregularly shaped particle. This SRM was developed to allow a more accurate
    monitoring of visible protein-like particles that may be found in biotherapeutics.
    The material is intended to be used as a particle size standard for qualifying
    and training visual inspection analysts on the visual inspection processes. One
    unit of SRM 1989 contains three (3) vials of irregularly shaped particles that
    are monodisperse in terms of size and morphology. The 3 vials consist of particles
    that have Area Based Diameters of nominally 100 µm, 150 µm, and 220 µm and Maximum
    Feret Diameters of nominally 1.5× the area based diameter. These sizes were measured
    using optical and electronic microscopy methods in terms of apparent size, as
    obtained by experimental optical systems, and actual size, which is corrected
    for diffraction effects arising from the experimental methods. This publication
    provides information on the production, measurement, and statistical determination
    of the uncertainties involved in the certification of SRM 1989.

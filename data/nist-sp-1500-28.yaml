abstract:
- language: en
  script: Latn
  content: Officers of the Court including judges and attorneys can benefit from receiving
    information from neutral sources to inform their understanding of foundational
    scientific and forensic science principles. Inspired by a request from Congress
    and a National Research Council report, the National Institute of Standards and
    Technology (NIST) Forensic Science Program has prepared 17 short primers covering
    aspects of quality, statistics, and communication. This information is intended
    as an entry point for Officers of the Court on scientific topics that can enable
    more informed use of forensic science evidence in cases they encounter.

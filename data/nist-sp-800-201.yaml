abstract:
- language: en
  script: Latn
  content: This document summarizes the research performed by the NIST Cloud Computing
    Forensic Science Working Group and presents the NIST Cloud Computing Forensic
    Reference Architecture (CC FRA or FRA), whose goal is to provide support for a
    cloud system’s forensic readiness. The CC FRA helps users understand the cloud
    forensic challenges that might exist for an organization’s cloud system. It identifies
    challenges that require at least partial mitigation strategies and how a forensic
    investigator would apply those strategies to a particular forensic investigation.
    The CC FRA presented here is both a methodology and an initial implementation.
    Users are encouraged to customize this initial implementation for their specific
    situations and needs.

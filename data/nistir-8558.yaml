abstract:
- language: en
  script: Latn
  content: This report documents the first SOUPS Design-A-Thon, which was held on
    August 11th, 2024, and focused on Designing Effective and Accessible Approaches
    for Digital Product Cybersecurity Education and Awareness. In total, eight individuals
    participated in the event, forming three teams. The teams each selected a mock
    product based on a selection of five Product Data Cards developed by the NIST
    team. Participants used the information on the Product Data Cards to develop a
    strategy for cybersecurity education and awareness for the product. Teams were
    successful in planning strategies that utilize novel techniques and sound best
    practices. From the participant teams’ designs, the NIST team identified highlights
    and takeaways that are further elaborated in this report.

abstract:
- language: en
  script: Latn
  content: This NIST Technical Note describes the use of combustion ion chromatography
    to measure halogen content (fluorine, chlorine, and bromine) in a variety of solid
    and liquid matrices, with a particular focus on materials containing per- and
    polyfluoroalkyl substances (PFAS). The research examines the major contributors
    to measurement uncertainty, including sample combustion mass, calibration curve
    development, background contamination, matrix effects, and instrument response.
    Method performance was improved through instrument calibration, blank subtraction
    and approaches to account for matrix-dependent behavior. The use of a partial
    loop injection system was also evaluated as an approach to extend the effective
    measurement range, including its impact on uncertainties. The effects of cations,
    variabilities in fluoride sensitivity, and incomplete PFAS combustion were studied
    using NIST SRM 2143, 3181, 3182, 3183, 3184, 3186, NIST RM 8446, and additional
    3rd-party reference standards. Concurrent determination of sulfur was also determined.
    This Technical Note provides new combustion efficiency and fluorine recovery values
    for selected NIST SRMs and RMs, along with several fluorotelomer alcohol and fluorotelomer
    acrylate compounds.

abstract:
- language: en
  script: Latn
  content: This document reports on the activities of a workshop held at the National
    Institute for Standards and Technology (NIST) on March 19–20, 2026 on the topic
    of Technologies and Use Cases for Smart Standards. The workshop was jointly organized
    by the Information Technology Laboratory and the Standards Coordination Office
    and included 30 participants drawn from standards development organizations (SDOs),
    government agencies, trade associations, non-profit organizations, universities,
    and companies. The report provides a short summary of the presentations and discussions
    held at the meeting.

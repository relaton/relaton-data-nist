abstract:
- language: en
  script: Latn
  content: 'The United States is actively addressing significant challenges in securing
    a reliable supply of Critical Minerals and Materials (CMMs) essential to modern
    technology and national security. With 63 unique CMMs currently identified by
    the USGS and DOE as having high supply-chain risk, the federal government is responding
    to bridge historical gaps in the domestic value chain. As the national metrology
    institute, NIST supports this federal effort by advancing the measurement science,
    standards, and data infrastructure necessary to underpin a resilient and circular
    domestic supply chain. Following a July 2025 internal workshop, this report synthesizes
    Nist’s active research and potential capabilities across four key pillars: material
    substitution, traceability, characterization, and recovery. These strategic efforts
    aim to provide the validated benchmarks required to empower U.S. manufacturers
    to substitute, recover, and utilize materials with precision and confidence.'

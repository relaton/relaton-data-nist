abstract:
- language: en
  script: Latn
  content: TREC 2025 is the thirty-fourth edition of the Text Retrieval Conference
    (TREC). The main goal of TREC is to create the evaluation infrastructure required
    for large-scale testing of information retrieval (IR) technology. This includes
    research on best methods for evaluation as well as development of the evaluation
    materials themselves. “Retrieval technology” is broadly interpreted to include
    a variety of techniques that enable and/or facilitate access to information that
    is not specifically structured for machine use. The TREC 2025 meeting was held
    online on December 11–12,2025.

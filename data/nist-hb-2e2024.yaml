abstract:
- language: en
  script: Latn
  content: NIST Handbook 150-2 presents the technical requirements and provides guidance
    for the accreditation of laboratories under the NVLAP Calibration Laboratories
    Accreditation Program (Calibration LAP). It supplements the NVLAP procedures and
    general requirements found in NIST Handbook 150, by tailoring the general criteria
    found in that Handbook to the specific calibrations and types of calibrations
    covered by the Calibration LAP. It is intended for information and use by accredited
    laboratories, laboratories seeking accreditation, laboratory accreditation systems,
    users of laboratory services, and others needing information on the requirements
    for accreditation under this program. The 2023 edition of NIST Handbook 150-2
    contains a few changes to the requirements applicable to all calibration laboratories
    and more significant changes to the annexes that cover specific technical fields
    of calibration. The document summarizes the changes in its Foreword. The requirements
    of NIST Handbook 150 and the specific requirements and interpretations in the
    NIST Handbook 150-2 must be combined to produce the criteria for accreditation
    in the NVLAP Calibration LAP. For more information visit the NVLAP website http://www.nist.gov/nvlap.

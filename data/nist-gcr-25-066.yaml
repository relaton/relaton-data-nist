abstract:
- language: en
  script: Latn
  content: The United States emerged from World War II as the dominant technology-driven
    economy in the world. The development of new technologies benefited from substantial
    investment in basic science. For decades, this science base was drawn upon to
    the extent that virtually every major technology with global reach was developed
    and initially commercialized within the U.S. economy. This was accomplished by
    an unprecedented combination of government and industry investment in research
    and development (R&D) coupled with subsequent investment in technology-implementing
    hardware and software, skilled labor, and a world leading technology-based infrastructure,
    including top-rated universities and government laboratories.

abstract:
- language: en
  script: Latn
  content: Autonomous vehicles (AVs) can perform driving tasks without any human intervention,
    relying on advanced technologies to sense their surroundings, exchange information
    with digital road-side infrastructure, make decisions, and control the vehicle.
    AVs use vehicle-to-everything (V2X) communication methods to exchange and share
    data with infrastructure, other vehicles, and other road users such as pedestrians
    for improved efficiency and safety. One of the main challenges of AVs is the interoperability
    of V2X communications. To address and overcome AV’s interoperability challenge,
    this paper introduces a cellular vehicle-to-everything (C-V2X) interoperability
    analyzer software tool developed at the National Institute of Standards and Technology
    (NIST). This paper describes C-V2X interoperability analyzer software design,
    functional description, installation, usage instructions, and software execution
    example. This software tool can be used to automatically analyze and assess C-V2X
    conformance and interoperability among commercial on-board units (OBUs) and road-side
    units (RSUs) based on the IEEE 1609.2, IEEE 1609.3, and SAE J2735 standards.

abstract:
- language: en
  script: Latn
  content: The NIST Special Publication (SP) 800-90 series of documents supports the
    generation of high quality random bits for cryptographic and non-cryptographic
    use. SP 800-90A, Recommendation for Random Number Generation Using Deterministic
    Random Bit Generators, specifies several deterministic random bit generator (DRBG)
    mechanisms based on cryptographic algorithms. SP 800-90B, Recommendation for the
    Entropy Sources Used for Random Bit Generation, provides guidelines for the development
    and validation of entropy sources. This document (SP 800-90C) specifies constructions
    for the implementation of random bit generators (RBGs) that include DRBG mechanisms
    as specified in SP 800-90A and that use entropy sources as specified in SP 800-
    90B. Constructions for four classes of RBGs — namely, RBG1, RBG2, RBG3, and RBGC
    — are specified in this document.

abstract:
- language: en
  script: Latn
  content: This guideline focuses on identity proofing and enrollment for use in digital
    authentication. During the process of identity proofing, an applicant provides
    evidence to a credential service provider (CSP) reliably identifying themselves,
    thereby allowing the CSP to assert that identification at a useful identity assurance
    level. This document defines technical requirements for each of three identity
    assurance levels. The guidelines are not intended to constrain the development
    or use of standards outside of this purpose. This publication supersedes NIST
    Special Publication (SP) 800-63A.

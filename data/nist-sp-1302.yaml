abstract:
- language: en
  script: Latn
  content: This Quick-Start Guide describes how to apply the CSF 2.0 Tiers. CSF Tiers
    can be applied to CSF Organizational Profiles to characterize the rigor of an
    organization’s cybersecurity risk governance and management outcomes. This can
    help provide context on how an organization views cybersecurity risks and the
    processes in place to manage those risks.​ The Tiers can also be valuable when
    reviewing processes and practices to determine needed improvements and monitor
    progress made through those improvements.

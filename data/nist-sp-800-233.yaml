abstract:
- language: en
  script: Latn
  content: The service mesh has become the de facto application services infrastructure
    for cloud-native applications. It enables the various runtime functions of an
    application through proxies that form the data plane of the service mesh. Depending
    on the distribution of the network layer functions and the granularity of association
    of the proxies to individual services and computing nodes, different proxy models
    or data plane architectures have emerged. This document describes a threat profile
    for each of the data plane architectures with a detailed threat analysis to make
    recommendations on their applicability for cloud-native applications with different
    security risk profiles.

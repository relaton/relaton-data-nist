abstract:
- language: en
  script: Latn
  content: The Food Nutrition and Safety Measurements Quality Assurance Program (FNSQAP)
    was launched in 2021. FNSQAP was established to assist laboratories in the development
    and validation of new analytical methods, in improving the quality of their analytical
    measurements, and in supporting compliance with federal regulations enforced by
    the FDA, USDA, and other international bodies. Exercise 3 of this program offered
    the opportunity for laboratories to assess their in-house measurements of nutritional
    elements (copper, magnesium, phosphorus), water-soluble vitamins (vitamin B12),
    fat-soluble vitamins (vitamin A), and contaminants (PFAS and pesticide residues)
    in food and infant formula samples. Major program goals include reducing the variability
    in consensus results as well as centering the consensus results about the target
    values over time through follow-up studies and educational outreach.

abstract:
- language: en
  script: Latn
  content: NIST SP 376, Metric Ruler is an educational tool designed to teach the
    International System of Units (SI) length measurements. The design includes approximate
    scales of 300 mm and 30 cm. One edge is graduated in centimeters by alternating
    solid markings in the style of a forensic photo scale. One edge is divided into
    1 dm, 10 cm, and 100 mm sections.

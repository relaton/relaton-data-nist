abstract:
- language: en
  script: Latn
  content: Digitalization in manufacturing is a concept that, while having existed
    for some time, can now be realized because of advancements in IIoT (Industrial
    Internet of Things) enabling technologies and data standardization. Digital twins
    are at the forefront of this trend and are being implemented by many manufacturers
    worldwide. To further encourage the adoption of digital twins by United States
    (U.S.) manufacturing enterprises, the Systems Integration Division (SID) at the
    National Institute of Standards and Technology (NIST) has established a Digital
    Twin Laboratory (DTL). In this report, we outline the vision and objectives of
    the DTL and provide fundamental information on digital twins within the context
    of manufacturing. We provide a detailed description of the DTL setup and case
    studies implemented in the lab. Additionally, the relevant standards implemented
    in the DTL are listed and their contexts in digital twins for manufacturing are
    briefly summarized. Lastly, we explore possible research areas that can be supported
    by the DTL and identify future efforts to accomplish research objectives.

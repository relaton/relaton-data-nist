abstract:
- language: en
  script: Latn
  content: 'Standard Reference Material (SRM) 965c Glucose in Frozen Human Serum is
    intended for use in validating methods for the determination of glucose in human
    serum and plasma. A unit of SRM 965c consists of three ampoules each of four materials:
    Level 1, Level 2, Level 3, and Level 4. Each ampoule contains approximately 1.0
    mL of frozen serum. The value assignment of SRM 965c was a collaboration between
    the National Institute of Standards and Technology (NIST) and the Division of
    Laboratory Sciences, Centers for Disease Control and Prevention (CDC). This publication
    documents the production, analytical methods, and computations involved in characterizing
    this product.'

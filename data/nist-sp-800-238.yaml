abstract:
- language: en
  script: Latn
  content: Throughout Fiscal Year 2025 (FY 2025) — from October 1, 2024, through September
    30, 2025 — the NIST Information Technology Laboratory (ITL) Cybersecurity and
    Privacy Program successfully responded to numerous challenges and opportunities
    in security and privacy. This Annual Report highlights the ITL Cybersecurity and
    Privacy Program’s FY 2025 research activities, including the ongoing participation
    and development of international standards, research, and practical applications
    in several key priority, including improved software and supply chain cybersecurity,
    work on IoT cybersecurity guidelines, National Cybersecurity Center of Excellence
    (NCCoE) projects, a new comment site for NIST’s Risk Management Framework, the
    release of a Phish scale, and progress in the Identity and Access Management program.

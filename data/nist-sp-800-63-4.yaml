abstract:
- language: en
  script: Latn
  content: These guidelines cover the identity proofing, authentication, and federation
    of users (e.g., employees, contractors, or private individuals) who interact with
    government information systems over networks. They define technical requirements
    in each of the areas of identity proofing, enrollment, authenticators, management
    processes, authentication protocols, federation, and related assertions. They
    also offer technical recommendations and other informative text as helpful suggestions.
    The guidelines are not intended to constrain the development or use of standards
    outside of this purpose. This publication supersedes NIST Special Publication
    (SP) 800-63-3.

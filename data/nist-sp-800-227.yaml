abstract:
- language: en
  script: Latn
  content: A key-encapsulation mechanism (KEM) is a set of algorithms that can be
    used by two par-ties under certain conditions to securely establish a shared secret
    key over a public channel. A shared secret key that is established using a KEM
    can then be used with symmetric-key cryptographic algorithms to perform essential
    tasks in secure communications, such as encryption and authentication. This document
    describes the basic definitions, properties, and applications of KEMs. It also
    provides recommendations for implementing and using KEMs in a secure manner.

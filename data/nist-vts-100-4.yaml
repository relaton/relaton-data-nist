abstract:
- language: en
  script: Latn
  content: The ability of voters to review and verify their selections before casting
    their ballot is an important step in the voting process. This report explores
    the legibility and readability of summary ballots printed by ballot marking devices
    (BMDs) and the ability of optical character recognition (OCR) applications commonly
    found on mobile phones to voice (read) summary ballots. The report looks at the
    visual presentation of the ballot to identify typographic elements that might
    make it easier to read visually, the feasibility of using (OCR) to allow blind
    or low vision voters to hear their ballot read accurately, and whether there is
    a relationship between the design elements that support both visual and OCR-assisted
    reading.

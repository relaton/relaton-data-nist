abstract:
- language: en
  script: Latn
  content: Producing neutrons in quantities sufficient for most applications is challenging
    and requires centralized facilities that develop and deploy cutting-edge instrumentation
    for the Nation’s scientific and engineering communities. For over 50 years, the
    NIST Center for Neutron Research (NCNR) has been at the forefront of neutron science,
    serving the Nation’s need for these essential measurement capabilities. However,
    as the current reactor ages, planning has begun for a replacement facility. This
    2023 workshop titled “Neutrons for the Future,” attended by over 200 participants
    from across the US, produced critical insights into the future of neutron measurement
    science and, therefore, the requirements for a future NIST Neutron Source (NNS).
    The conceptual design of the NNS, accompanying facilities, equipment, and staffing,
    will be directed by key findings and priorities identified in this workshop.

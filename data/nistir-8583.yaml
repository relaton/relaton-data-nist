abstract:
- language: en
  script: Latn
  content: This report describes a terrestrial laser scanner (TLS) testing event,
    the NIST Measurement Week, held at the National Institute of Standards and Technology
    (NIST) during the week of May 12-16, 2025. The Crime Scene Investigation and Reconstruction
    (CSIR) subcommittee of the Organization of Scientific Area Committees (OSAC) for
    Forensic Science is currently involved in the development of an Interim Performance
    Assessment (IPA) procedure that can be performed in-house by law enforcement agencies
    and forensic consulting firms. The Dimensional Metrology Group (DMG) at NIST set
    up the test at their facility and invited law enforcement agencies and TLS manufactures
    to run the IPA and provide feedback. This report describes the event, the lessons
    learned and key takeaways.

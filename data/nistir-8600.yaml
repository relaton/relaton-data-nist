abstract:
- language: en
  script: Latn
  content: Reliable measurements are crucial to monitoring the environmental systems
    that support efficient food production, natural resource extraction, recreation,
    habitation, and many other economically important sectors. A summary is provided
    of the presentations, discussion, and findings from a two-and-a-half-day workshop
    on environmental measurements. The workshop focused on needs for new measurement
    science and measurement standards to support the characterization of terrestrial,
    aquatic, and atmospheric systems. The workshop consisted of formal talks and guided
    discussion sessions, during which overarching challenges within the field of environmental
    measurements were identified. These challenges included insufficient representativeness,
    measurement nonstationarity, obstacles to data continuity, and inconsistent or
    invalid reporting of measurement uncertainty. Suggestions on addressing these
    challenges focused on finding opportunities for collaboration between NIST and
    the environmental measurement community, which could support educational efforts
    on best practices for uncertainty quantification, sensor intercomparisons, and
    standardization efforts. Environmental measurements include many areas of study
    that are already of interest to NIST, and the findings of this workshop suggest
    that there are opportunities for collaborations between environmental researchers
    and the metrology community.

abstract:
- language: en
  script: Latn
  content: This document describes a security platform for trustworthy email exchanges
    across organizational boundaries. The project includes reliable authentication
    of mail servers, digital signature and encryption of email, and binding cryptographic
    key certificates to sources and servers. The example solutions and architectures

abstract:
- language: en
  script: Latn
  content: The melt flow rate of Standard Reference Material (SRM) 1474c, a linear
    polyethylene (narrow MWD ethylene-hexene copolymer) resin, was determined to be
    5.04 g/10 min at 190 °C under a load of 2.16 kg using the ASTM Method D 1238-23a.
    The average is a result from 30 determinations on samples with a standard deviation
    of 0.016 g/10 min. The overall expanded uncertainty, including type A and type
    B uncertainties, is estimated as 0.20 g/10 min. This document describes details
    of the measurement and analysis.

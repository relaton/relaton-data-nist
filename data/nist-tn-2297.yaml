abstract:
- language: en
  script: Latn
  content: Mass spectrometry (MS) is an analytic tool for measuring mass-to-charge
    ratios of molecules or molecular fragments. It is often used to identify and classify
    compounds. A mass spectrometer measures the mass of molecules and produces a signal
    proportional to the number detected fragments, thus, intensity can be interpreted
    as a function of mass-to-charge. One objective in mass spectrometry is distinguishing
    compounds using their measured mass spectra. In this technical report we describe
    the mathematical machinery required to compute a new similarity measure posed
    in a Hilbert space.

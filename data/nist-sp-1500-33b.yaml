abstract:
- language: en
  script: Latn
  content: 'In 2018 in conjunction with the National Institute of Justice (NIJ), the National Institute of Standards and Technology (NIST) assembled a group of multidisciplinary experts, the Evidence Management Steering Committee, to develop a plan to (1) provide recommendations for the retention, preservation, integrity, and disposition of evidence and property and (2) encourage the adoption of practice improvements, through education and engagement, of the broad community of U.S. justice system stakeholders involved in evidence management. The committee oversaw four major activities: an evidence management survey (this document), are view of existing literature in forensic evidence management (NIST SP 1500-33C); a stakeholder workshop; and the dissemination of findings from these activities (NIST SP 1500-33A and https://doi.org/10.18434/mds2-3834, which provides survey data).'

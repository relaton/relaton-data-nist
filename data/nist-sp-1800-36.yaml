abstract:
- language: en
  script: Latn
  content: Establishing trust between a network and an Internet of Things (IoT) device
    (as defined in NIST Internal Report 8425) prior to providing the device with the
    credentials it needs to join the network is crucial for mitigating the risk of
    potential attacks. There are two possibilities for attack. One happens when a
    device is convinced to join an unauthorized network, which would take control
    of the device. The other occurs when a malicious device infiltrates a network.
    Trust is achieved by attesting and verifying the identity and posture of the device
    and the network before providing the device with its network credentials—a process
    known as network-layer onboarding. In addition, scalable, automated mechanisms
    are needed to safely manage IoT devices throughout their lifecycles, such as safeguards
    that verify the security posture of a device before the device is permitted to
    execute certain operations. In this practice guide, the National Cybersecurity
    Center of Excellence (NCCoE) applies standards, best practices, and commercially
    available technology to demonstrate various mechanisms for trusted network-layer
    onboarding of IoT devices in Internet Protocol-based environments. This guide
    shows how to provide network credentials to IoT devices in a trusted manner and
    maintain a secure device posture throughout the device lifecycle, thereby enhancing
    IoT security.

abstract:
- language: en
  script: Latn
  content: Most recent cybersecurity breaches have involved compromised credentials.
    Migrating from single-factor to multi-factor authentication (MFA) reduces the
    risk of compromised credentials and unauthorized access. Both criminal and noncriminal
    justice agencies need to access criminal justice information (CJI); to reduce
    the risk of unauthorized access, the Criminal Justice Information Services (CJIS)
    Security Policy now requires the use of MFA when accessing CJI. This document
    provides practical information to agencies that are implementing MFA, reflecting
    on lessons learned from agencies around the country and from CJI-related technology
    vendors.

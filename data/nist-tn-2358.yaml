abstract:
- language: en
  script: Latn
  content: In this work, we provide recommended normal melting points, binary eutectic
    melting points, and heats of fusion for the metal halides. Recommended melting
    points are provided for about 320 compounds. Recommended temperatures are provided
    for about 750 individual binary eutectic transitions for about 540 binary pairs.
    A eutectic point is a temperature where a liquid phase is in equilibrium with
    two solid phases (Liquid A + B). Eutectics are minimums in the equilibrium phase
    diagrams – melting at lower temperatures than the individual components.

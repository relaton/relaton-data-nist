abstract:
- language: en
  script: Latn
  content: Survey responses from occupants involved in a 32-story high-rise building
    evacuation during an actual fire were collected and analyzed to study the pre-evacuation
    period. Multiple regression models were used to test whether specific occupant,
    building, and environmental factors predicted pre-evacuation times. This study
    found that the main influential factors of pre-evacuation times were actions taken
    during this period, especially by certain groups of occupants, and floor (mostly
    likely due to the information that occupants received on these floors). This study
    also quantified the relationships between factors and pre-evacuation time, showing
    how much pre-evacuation time was required for each factor.

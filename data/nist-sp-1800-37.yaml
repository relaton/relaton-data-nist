abstract:
- language: en
  script: Latn
  content: The Transport Layer Security (TLS) protocol is widely deployed to secure
    network traffic. TLS 1.3 has been strengthened so that even if a TLS-enabled server
    is compromised, the contents of its previous TLS communications are still protected—also
    known as forward secrecy. The approach used to achieve forward secrecy may interfere
    with passive decryption techniques that enterprises use to gain more visibility
    into their TLS 1.2 traffic. Enterprises’ authorized network security staff rely
    on that visibility to implement controls that conform to cybersecurity, operational,
    and regulatory requirements—forcing them to choose between using the TLS 1.2 protocol
    or adopting the more secure TLS 1.3 to gain an alternative method for internal
    traffic visibility. The NCCoE, in collaboration with technology providers and
    enterprise customers, initiated a project to demonstrate options for maintaining
    visibility within the TLS 1.3 protocol using several standards-compliant builds
    that enterprises can use for real-time and post-facto systems monitoring and analytics
    capabilities. This publication contains demonstrated proofs of concept along with
    links to detailed technical information on Github. You can use this guidance to
    implement the builds described in this document. This guide also includes links
    to mappings of TLS 1.3 visibility principles to commonly used security standards
    and guidance.

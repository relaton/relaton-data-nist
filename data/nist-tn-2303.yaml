abstract:
- language: en
  script: Latn
  content: This report of test describes a series of experiments that investigated
    the burning behavior of single items and assemblies commonly found in offices
    and residences, including chairs, sofas, mattresses with pillows and bedclothes,
    and some miscellaneous items such as laptops, bookshelves, and side tables. The
    measurements were conducted in the open under fully-ventilated and quasi-quiescent
    conditions. The global measurements reported include the transient, peak and total
    heat release rates, the yields of CO and soot, and the mass loss. The appearance
    of the fires was captured by video cameras from two orthogonal views. Measurements
    of the heat flux to the surroundings from the test specimens were used to estimate
    the radiative fraction of the fires. The data generated from the study are included
    in the NIST Fire Calorimetry Database (FCD), which links to this report.

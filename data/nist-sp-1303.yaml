abstract:
- language: en
  script: Latn
  content: This guide provides an introduction to using the NIST Cybersecurity Framework
    (CSF) 2.0 for planning and integrating an enterprise-wide process for integrating
    cybersecurity risk management information, as a subset of information and communications
    technology risk management, into enterprise risk management. The use of CSF common
    language and outcomes supports the integration of risk monitoring, evaluation,
    and adjustment across various organizational units and programs.

abstract:
- language: en
  script: Latn
  content: This report provides a brief background of the National Marine Mammal Tissue
    Bank (NMMTB), information on the composition of the collection, policies for specimen
    use, and links to a downloadable and searchable specimen inventory. The inventory
    covers specimens collected from the Alaska Marine Mammal Tissue Archival Program
    (AMMTAP) and the Marine Mammal Health and Stranding Response Program (MMHSRP)
    by contributors between 1987 and April 2025.

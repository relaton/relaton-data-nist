abstract:
- language: en
  script: Latn
  content: NIST hosted an in-person, all-day workshop on February 27, 2024, to discuss
    existing and emerging cybersecurity threats and mitigation techniques for semiconductors
    throughout their life cycle. The workshop obtained valuable feedback from industry,
    academia, and government to inform NIST’s development of cybersecurity and supply
    chain standards, guidance, and recommended practices. The discussion focused on
    semiconductor development and highlighted cybersecurity measurements and metrics
    that utilize reference data sets to facilitate the testing, attestation, certification,
    verification, and validation of semiconductor components. It also emphasized the
    use of automated cybersecurity tools and techniques to secure manufacturing environments
    throughout the development life cycle. This report summarizes the content that
    was presented and discussed at the workshop.

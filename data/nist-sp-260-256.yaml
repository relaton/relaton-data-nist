abstract:
- language: en
  script: Latn
  content: Standard Reference Material (SRM) 3672a Organic Contaminants in Smokers’
    Urine (Frozen) and SRM 3673a Organic Contaminants in Non-Smokers’ Urine (Frozen)
    are intended for use in evaluating analytical methods for the determination of
    selected naturally-occurring smoking-related compounds and metabolites in urine.
    The development of SRMs 3672a and 3673a was a collaboration between the National
    Institute of Standards and Technology (NIST) and the Division of Laboratory Sciences,
    Centers for Disease Control and Prevention (CDC). This publication documents the
    production, analytical methods, and statistics used to characterize these products.

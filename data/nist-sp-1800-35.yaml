abstract:
- language: en
  script: Latn
  content: A zero trust architecture (ZTA) enables secure authorized access to enterprise
    resources that are distributed across on-premises and multiple cloud environments,
    while enabling a hybrid workforce and partners to access resources from anywhere,
    at any time, from any device in support of the organization’s mission. This NIST
    Cybersecurity Practice Guide explains how organizations can implement ZTA consistent
    with the concepts and principles outlined in NIST Special Publication (SP) 800-207,
    Zero Trust Architecture. The NCCoE worked with 24 collaborators under Cooperative
    Research and Development Agreements (CRADAs) to integrate commercially available
    technology to build 19 ZTA example implementations and demonstrate a number of
    common use cases. The Guide includes detailed technical information on each example
    ZTA implementation, providing models that organizations can emulate. The guide
    also summarizes best practices and lessons learned from the implementations and
    integrations to make it easier and more cost-effective to implement ZTA. Additionally,
    this guide includes mappings of ZTA principles and technologies to commonly used
    security standards and guidelines.

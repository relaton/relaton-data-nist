abstract:
- language: en
  script: Latn
  content: The rapid pace of maturation of metal additive manufacturing (AM) technologies,
    makes them an excellent candidate for the fabrication of nuclear power plant (NPP)
    components. However, the current levels of process variations create numerous
    challenges yet to be overcome for industrial acceptance of AM for NPP applications.
    One of those challenges is associated with the qualification and certification
    of fabricated components for mission-critical applications such as NPPs. To reduce
    the cost of qualification and certification, in-process monitoring and in-process
    non-destructive evaluation (NDE) are considered essential tools. This report aims
    to support the efforts of the U.S. Nuclear Regulatory Commission (NRC) to meet
    the challenges of the certification of the NPP components fabricated by AM technologies.
    It provides a review of the current state-of-the-art in the areas of in-process
    monitoring and in-process NDE methods, instruments, and relevant standards, identifying
    gaps in knowledge, technologies, and standards to achieve the goal of using them
    as robust tools for the AM process and part qualification.

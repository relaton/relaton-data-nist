abstract:
- language: en
  script: Latn
  content: 'This document is the triennial strategic plan for the Manufacturing USA
    Program, as required by the program’s authorizing statute. This strategic plan
    addresses the role of the Manufacturing USA institutes in developing advanced
    manufacturing technology; fostering resilient, domestic supply chains; and building
    a diverse and equitable manufacturing workforce. The Manufacturing USA institutes
    are an important part of that work. They help facilitate U.S. leadership in advanced
    manufacturing and build a strong workforce. The institutes work through public-private
    partnerships and are involved in a range of cutting-edge technologies from robotics
    to additive manufacturing to biomanufacturing. Guided by this Strategic Plan,
    the NIST Advanced Manufacturing National Program Office works with the Federal
    agency partners to coordinate the network of institutes to achieve the following
    vision and mission. The vision for the Manufacturing USA program is U.S. global
    leadership in advanced manufacturing through the development and transition of
    innovative technologies into scalable, cost-effective, and high-performing domestic
    manufacturing capabilities. To support this vision, the mission of the Manufacturing
    USA Program is to connect people, ideas, and technology to solve industry-relevant
    advanced manufacturing challenges, thereby enhancing industrial competitiveness.
    Based on the vision and mission of the Manufacturing USA Program, the Federal
    agency partners and institutes work toward four goals that flow from the purposes
    stated in the authorizing legislation and are consistent with each sponsoring
    agency’s mission: Goal 1: Increase the competitiveness of U.S. manufacturing Goal
    2: Facilitate the transition of innovative technologies into scalable, cost-effective,
    and high-performing domestic manufacturing capabilities Goal 3: Accelerate the
    development of an advanced manufacturing workforce Goal 4: Promote a network of
    institutes that build long-term support for and within their communities These
    four program goals are interrelated elements of a robust strategy for supporting
    manufacturing innovation by reducing the time required to transition early-stage
    research to commercial development and, ultimately, deployment in U.S. manufacturing
    environments. The goals guide the network of agency partners and institutes to
    advance U.S. domestic manufacturing capability while leveraging the economic and
    national security benefits from other Federal and private sector investments in
    fundamental research.'

abstract:
- language: en
  script: Latn
  content: The National Institute of Standards and Technology (NIST) Dietary Supplement
    Laboratory Quality Assurance Program (DSQAP) was launched in 2007 in part as a
    collaboration with the National Institutes of Health (NIH) Office of Dietary Supplements
    (ODS). The DSQAP enables laboratories to improve the accuracy of measurements
    in samples for nutrients, marker compounds, toxic elements, and/or contaminants
    in dietary supplement ingredients and finished products. Primary program goals
    include centering the consensus range about the target value and reducing the
    size of the consensus range. Exercise 2 is the seventeenth DSQAP exercise (previously,
    they were designated “A” through “O”). Exercise 2 was designed with four studies,
    offering the opportunity for laboratories to assess their in-house techniques
    on a variety of measurements. Studies included determinations of select toxic
    elements in ginger and eleuthero extracts, vitamins in a multivitamin and saw
    palmetto extract, fatty acids in fish oils, and botanical marker compounds in
    dietary supplement ingredient materials and finished products. This report summarizes
    the results, describes observations, and provides technical recommendations for
    measurement improvements.

abstract:
- language: en
  script: Latn
  content: Throughout Fiscal Year 2024 (FY 2024) — from October 1, 2023, through September
    30, 2024 — the NIST Information Technology Laboratory (ITL) Cybersecurity and
    Privacy Program successfully responded to numerous challenges and opportunities
    in security and privacy. This Annual Report highlights the ITL Cybersecurity and
    Privacy Program’s FY 2024 research activities, including the ongoing participation
    and development of international standards, research and practical applications
    in several key priority areas (e.g., post-quantum cryptography, NIST Cybersecurity
    Framework [CSF 2.0], and new CSF profiles), improved software and supply chain
    cybersecurity, work on IoT cybersecurity guidelines, National Cybersecurity Center
    of Excellence (NCCoE) projects, a new comment site for NIST’s Risk Management
    Framework, the release of a Phish scale, progress in the Identity and Access Management
    program, and Strategic and Emerging Research Initiatives (SERI) for autonomous
    vehicles.

abstract:
- language: en
  script: Latn
  content: In 2020, the National Institute of Standards and Technology (NIST)-led
    Rapid Microbial TestingMethods (RMTM) Consortium was established to develop standards
    and measurement-basedsolutions to facilitate the adoption of RMTMs in advanced
    therapy products. To update thecommunity on the Consortium's progress and work
    on its deliverables, NIST hosted its 5thannual workshop on RMTMs. This report
    summarizes the key findings from the workshop,which was held as a single-day virtual
    event featuring external speakers. The workshop broughttogether a diverse group
    of stakeholders, including advanced therapy producers, developers ofRMTM assays
    and instruments, and producers of cell reference materials.

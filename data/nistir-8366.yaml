abstract:
- language: en
  script: Latn
  content: This document provides guidance to NIST staff regarding the use of inclusive
    language in documentary standards and documents which support the realization
    and dissemination of physical standards; Standards Developing Organizations' (SDOs)
    policies and procedures; and standards development participation. The document
    is intended to be used as guidance by NIST standards participants seeking to be
    impactful in addressing these issues.

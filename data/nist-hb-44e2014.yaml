abstract:
- language: en
  script: Latn
  content: Handbook 44 was first printed in 1949, having been preceded by similar
    handbooks of various designations and in several forms. This 2014 edition was
    developed by the Committee on Specifications and Tolerances of the National Conference
    on Weights and Measures (NCWM) with the assistance of the Weights and Measures
    Division of the National Institute of Standards and Technology (NIST). The handbook
    includes amendments adopted by the 98th Annual Meeting of the NCWM in 2013. NIST
    Handbook 44 is published in its entirety each year following the NCWM Annual Meeting.

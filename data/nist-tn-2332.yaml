abstract:
- language: en
  script: Latn
  content: This document serves as the documentation for the Fire Data Generator (FD-Gen),
    an automated tool designed to streamline the creation of multiple Fire Dynamics
    Simulator (FDS) input files. By employing Monte Carlo methods to sample relevant
    fire parameters, FD-Gen creates diverse fire scenarios and seamlessly integrates
    them into FDS case input files. This tool is designed to efficiently produce large
    volumes of synthetic fire data, supporting the development and training of machine
    learning models for smart fire detection and forecasting applications. Additionally,
    FD-Gen may offer practical benefits for applications such as fire risk assessment
    and fire investigation, broadening its impact across fire safety and research
    domains.

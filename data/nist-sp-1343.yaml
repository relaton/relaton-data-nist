abstract:
- language: en
  script: Latn
  content: 'Although smart home adoption in the United States (U.S.) is growing, smart
    home users may harbor security and privacy concerns or uncertainty about how to
    best protect their devices and the data those collect. Further, there have been
    few insights into how users’ perspectives on smart home security and privacy differ
    depending on device category. This may leave the smart home community at a disadvantage
    in knowing how to focus user education efforts to address device- specific misunderstandings
    or concerns. As a result, consumers may remain uninformed or lack motivation to
    protect some device categories, leaving devices and data vulnerable. Towards closing
    this gap, we conducted a survey of 401 U.S. smart home users with devices in five
    categories: lighting, security devices, sensors, thermostats, and voice assistants.
    Participants viewed voice assistants as most problematic and were most confident
    about security devices and thermostats. We also report novel results related to
    perceptions of smart home security and privacy responsibility and users’ thoughts
    on device categories seldom explored in research. Our identification of differences
    across device categories can contribute to greater user empowerment through tailored
    smart home user education materials.'

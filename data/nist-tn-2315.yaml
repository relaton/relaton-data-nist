abstract:
- language: en
  script: Latn
  content: This paper introduces a set of cellular vehicle-to-everything (C-V2X) datasets
    collected at the National Institute of Standards and Technology (NIST) Internet
    of Thing (IoT) Devices Interoperability Testbed. These datasets can be used to
    examine, analyze, and assess C-V2X compatibility and interoperability among commercial
    on-board units (OBUs) and road-side units (RSUs) based on IEEE 1609.2, 1609.3,
    and SAE J2735 standards.

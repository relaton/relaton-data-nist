abstract:
- language: en
  script: Latn
  content: The purpose of Special Publication 800-30 is to provide guidance for conducting
    risk assessments of federal information systems and organizations, amplifying
    the guidance in Special Publication 800-39. Risk assessments, carried out at all
    three tiers in the risk management hierarchy, are part of an overall risk management
    process⁰₄providing senior leaders/executives with the information needed to determine
    appropriate courses of action in response to identified risks.

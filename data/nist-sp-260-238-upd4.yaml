abstract:
- language: en
  script: Latn
  content: The National Institute of Standards and Technology (NIST) Standard Reference Material® (SRM®)3666 Albumin and Creatinine in Frozen Human Urine is a secondary measurement standard for albumin and creatinine in human urine. The material is intended for use in a calibration hierarchy, in the validation of measurement procedures, or as quality control material for the determination of albumin, creatinine, or the albumin to creatinine ratio (ACR) in human urine. A unit of SRM3666 consists of four (4) vials of frozen pooled human urine with four (4) different levels (Level Ito Level IV) of endogenous albumin determined using the NIST reference measurement procedure (RMP) for albumin in urine, and creatinine determined using a modification of the NIST RMP for creatinine in serum. The certified values and associated uncertainties for albumin and creatinine were used to calculate the ACR for each level (Level I to Level IV). This publication documents the production, measurement processes, results, and statistical evaluations involved in the production and certification of SRM 3666.

abstract:
- language: en
  script: Latn
  content: This Recommendation provides cryptographic key management guidance. It
    consists of three parts. Part 1 provides general guidance and best practices for
    the management of cryptographic keying material. Part 2 provides guidance on policy
    and security planning requirements for U.S. government agencies. Finally, Part
    3 provides guidance when using the cryptographic features of current systems.

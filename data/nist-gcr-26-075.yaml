abstract:
- language: en
  script: Latn
  content: 'Forward-Looking Codes and Standards: Final Report includes a summary and
    synthesis from the four workshop reports: Future Hazards, Future Load Effects,
    Design Guidelines and Criteria, and Adaptation and Resilience. The final report
    includes a summary state of the art discussion and a thorough synthesis of next
    generation codes and standards including Future Hazard Data and Information; Future
    Loads, Load Effect and Infrastructure Conditions; Design Guidelines, Criteria,
    and Tools; Resilience and Adaptation; Planning and Design Frameworks; and Codes
    and Standards. Conclusions and research recommendations are integrated.'

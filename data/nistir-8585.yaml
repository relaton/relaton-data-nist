abstract:
- language: en
  script: Latn
  content: The National Institute of Standards and Technology (NIST) Dietary Supplement
    Laboratory Quality Assurance Program (DSQAP) was launched in 2007 as a collaboration
    with the National Institutes of Health (NIH) Office of Dietary Supplements (ODS).
    The DSQAP enables laboratories to improve the accuracy of measurements for nutrients,
    marker compounds, toxic elements, and/or contaminants in dietary supplement raw
    materials, ingredients, and finished products. Primary program goals include centering
    the consensus range about the target value and reducing the size of the consensus
    range. Exercise 3 is the eighteenth DSQAP exercise (previously, designated “A”
    through “O”). Exercise 3 included with four studies, offering the opportunity
    for laboratories to assess their in-house techniques on a variety of measurements.
    Studies included determinations of select toxic elements in kava root and kava
    extract materials, fat-soluble vitamins in two different multivitamin tablets,
    water-soluble vitamins in a multivitamin and yohimbe containing solid oral dosage
    form, and botanical marker compounds in kava root and kava extract. This report
    summarizes the results, describes observations, and provides technical recommendations
    for measurement improvements.

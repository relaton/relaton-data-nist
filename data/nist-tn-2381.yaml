abstract:
- language: en
  script: Latn
  content: 'This report describes a 4 m instrumented drop tower (IDT) system in use at the National Institute of Standards and Technology (NIST). Drop tower systems are a relatively common means of testing various impact-like scenarios, often for armor or padding materials, with controlled impacts at known energies. Although originally designed for standardized stab testing, the capabilities of this IDT have been expanded. In this implementation the system is instrumented to measure accelerations, forces and force distribution, impact velocity, and test piece deformation. It is modular, with configurable impactor mass, geometry, drop height, specimen or test artifact type, and fixture. Thus, the drop tower system is suitable for stab testing, impact testing, material characterization, and other related measurements on artifacts ranging from from whole armor and helmeted head forms to specimens of novel impact mitigating materials. Two illustrative examples are provided in this report: characterization of helmet liner foam and stab testing of a novel armor prototype.'

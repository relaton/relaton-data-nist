abstract:
- language: en
  script: Latn
  content: On January 12-13, 2016, the Applied Cybersecurity Division (ACD) in the
    National Institute of Standards and Technology (NIST) Information Technology Laboratory
    (ITL) hosted Applying Measurement Science in the Identity Ecosystema workshop
    to discuss the application of measurement science to digital identity management.
    This document summarizes the concepts and ideas presented at the workshop and
    serves as a platform to receive feedback on the major themes discussed at that
    event.

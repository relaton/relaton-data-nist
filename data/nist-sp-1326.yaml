abstract:
- language: en
  script: Latn
  content: Due diligence research is the investigative process of researching all
    available, pertinent information about a given supplier or product so that informed
    decisions can be made on new acquisitions or existing systems. This Quick-Start
    Guide provides cybersecurity supply chain risk management (C-SCRM) program management
    capabilities with considerations for creating due diligence supply chain risk
    assessments in accordance with NIST Special Publication (SP) 800-161 (Revision
    1). Due diligence supplier assessments can be applied to any type of supplier,
    but this Quick-Start Guide is scoped to information and communications technology
    (ICT) suppliers. The components of a Due Diligence Assessment are Foreign Ownership,
    Control, or Influence (FOCI); Provenance; Resilience; Foundational Cyber Practices;
    and Supply Chain Tiers.

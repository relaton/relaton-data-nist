abstract:
- language: en
  script: Latn
  content: In August 2024, the National Institute of Standards and Technology (NIST)
    co-sponsored ConnectCon, an interactive workshop that facilitated meaningful conversations
    and connections between researchers and practitioners on the topic of human-centered
    cybersecurity. During the workshop, cybersecurity and human factors experts came
    to consensus on what they saw as the most pressing human-centered cybersecurity
    challenges today and potential solutions to address those challenges. This report
    provides an overview of the workshop as well as more detail about the identified
    challenges and solutions.

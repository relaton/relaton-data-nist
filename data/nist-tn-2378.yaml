abstract:
- language: en
  script: Latn
  content: Given the increasing prevalence of using Environmental Product Declarations
    (EPDs) for product comparisons and selection, both domestically and globally,
    there is a need to ensure the results reported in EPDs are useful for such comparisons
    (i.e., transparent and standardized to ensure quality decision making). One challenge
    that was identified more than a decade ago was the lack of common data sources,
    which could undermine the comparability of EPDs and similar claims. Federal agencies
    have targeted this issue through the development of public secondary datasets
    and gap assessments of currently available public life cycle inventory (LCI) datasets.
    This study follows the framework for the identification and quantification of
    public data gaps developed and applied to construction materials in NIST TN 2338
    and expanded in and applied to a building system component in NIST TN 2350 and
    NIST TN 2355. This last technical note addressed the final application of one
    semiconductor, a residential photovoltaic system. In this study, those data gaps
    identified in TN 2350 and TN 2355 that contributed to more than 1 % to an impact
    category are filled using the United States Extended Environmental Input Output
    (USEEIO) repository. The scope of this study is to (1) systematize data gap prioritization,
    (2) fill those data gaps using bridges to the USEEIO repository, and (3) evaluate
    the effect of filling those gaps has on select impact categories. The study concludes
    with a series of recommendations to use USEEIO as means of filling data gaps in
    other repositories.

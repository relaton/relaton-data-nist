abstract:
- language: en
  script: Latn
  content: Wildland-urban interface (WUI) fires are a threat to thousands of communities
    in the United States. Thousands of structures are destroyed, and thousands of
    lives are threatened or upended by fires every year. There are valuable lessons
    to be learned from these WUI fire events to help communities become more prepared,
    resilient, and resistant to fires in the future. Since 2007, the National Institute
    of Standards and Technology (NIST) has conducted four post-fire case studies to
    do just that. This document summarizes the past case studies, which have served
    as a technical anchor for NIST’s WUI research, as background and motivation for
    future case studies. The approach and methodology for data collection and analysis
    is described. A range of different post-fire deployment possibilities is presented
    along with parameters to consider for future case studies including areas of technical
    interest, staffing, training requirements, and suggested tools and equipment.

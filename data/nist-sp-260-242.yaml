abstract:
- language: en
  script: Latn
  content: A new Standard Reference Material® (SRM®), designated SRM 2232a, has been
    certified for the temperature and enthalpy calibration of differential scanning
    calorimeters (DSCs). This is a replacement for the previously sold out version,
    SRM 2232. SRM 2232a was sourced from a single lot of high-purity ( 99.99999%
    metals basis, by weight) indium. The melting point of SRM 2232a has been certified
    to be equal to (156.5985 ± 0.00032) °C using a fixed-point cell and direct comparisons
    with the NIST laboratory reference cell that constitutes NIST’s primary realization
    of the indium freezing point. The enthalpy of fusion of SRM 2232a has been certified
    to be equal to (28.58 ± 0.17) J·g-1 via DSC measurements using an instrument calibrated
    with certified reference materials obtained from another national metrology institute.
    This document provides all relevant measurement and analysis details for the certification
    of SRM 2232a.

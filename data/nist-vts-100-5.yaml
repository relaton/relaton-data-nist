abstract:
- language: en
  script: Latn
  content: 'Voting systems must support multiple interaction modes: presenting information
    both visually and auditorily, accepting navigation and selections from both screen
    touches and key presses on a tactile controller. The best practices outlined in
    this document focus on the audio and tactile controller experience. These best
    practices are intended to give voting system designers methods to improve their
    existing audio or for creating audio for a new voting system. These best practices
    describe an incremental approach to testing the audio with voters with disabilities,
    before the audio has been programmed into the system and is potentially more difficult
    to change, thereby providing an opportunity to improve the audio experience and
    give those voters an optimal voting experience.'

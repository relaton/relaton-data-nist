abstract:
- language: en
  script: Latn
  content: The purpose of this document is to provide an overview of the Security
    Content Automation Protocol (SCAP). This document discusses SCAP at a conceptual
    level, focusing on how organizations can use SCAP-enabled tools to enhance their
    security posture. It also explains to IT product and service vendors how they
    can adopt SCAP's capabilities within their offerings.

abstract:
- language: en
  script: Latn
  content: Multidimensional scaling is a popular technique for visualizing dissimilarities
    between objects in complex datasets. For a single dataset, different initial configurations
    for multidimensional scaling may produce representations with qualitatively different
    features. This presents both challenges and opportunities for those who use these
    methods. We introduce the new technique Topological Initialization for Multidimensional
    Scaling (TIMDS) which employs cycle representatives, a tool from topological data
    analysis, to generate multidimensional scaling initializations. We show that for
    some datasets, TIMDS produces representations with competitive stress values and
    better visualization of key dataset attributes compared to random or classical
    initialization methods.

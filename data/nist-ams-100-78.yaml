abstract:
- language: en
  script: Latn
  content: The third biannual Photopolymer Additive Manufacturing Alliance Workshop
    was held on September 15-16, 2025, at the University of Colorado Boulder to continue
    its mission of advancing photopolymer additive manufacturing (PAM). Building on
    the 2023 PAMA Workshop, the 2025 iteration brought together leaders from industry,
    national laboratories, academia, standards organizations, and startups to assess
    the current state and future trajectory of PAM, also known as vat photopolymerization
    (VPP). The workshop centered on four panels themed around the state-of-the-field
    and outlook, novel materials and metrology, and safety and standards, with a final
    panel focusing on an innovative VPP newcomer, volumetric additive. All panels
    highlighted the need to integrate material and hardware innovation with AI-driven
    data infrastructure, standardized metrology, and regulatory readiness to accelerate
    an application-driven manufacturing approach.

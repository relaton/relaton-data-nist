abstract:
- language: en
  script: Latn
  content: This report details the development of different structural design building
    archetypes and other seismic enhancements, the cost estimation process applied
    to those archetypes, and the economic implications and estimation of differing
    functional recovery times of the structural design choices after earthquake events.
    This culminates in a comparative benefit-cost analysis (BCA) of damage and recovery
    after earthquake events across the different structural archetypes and varying
    levels of structural stiffness. Using a framework that integrates civil engineering
    principles with economic evaluation, the research quantifies the economic implications
    of differences in performance of common structural systems—such as steel and concrete
    moment-resisting frames, shear walls, and braced frames, at different structural
    and non-structural intervention levels—under seismic loads. The cost estimation
    development process is described, and comparisons are made between industry and
    commercial construction cost data sources. The report lays the groundwork for
    the quantification of the trade-offs between initial construction costs, potential
    earthquake-induced damages, and economic benefits. The results suggest substantial
    direct savings from recovery-based design in terms of repair costs. These insights
    provide actionable guidance for engineers and policymakers seeking to balance
    safety, resilience, and cost-efficiency in seismic design, ultimately contributing
    to more economically resilient infrastructure in earthquake-prone regions.

abstract:
- language: en
  script: Latn
  content: This report describes an approach to capturing and documenting the network
    communication behavior of Internet of Things (IoT) devices. From this information,
    manufacturers, network administrators, and others can create and use files based
    on the Manufacturer Usage Description (MUD) specification to manage access to
    and from those IoT devices. The report also describes the current state of implementation
    of the approach and proposals for future development.

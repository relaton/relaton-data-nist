abstract:
- language: en
  script: Latn
  content: Geotechnical engineers are routinely faced with challenging problems relating
    to soil, water, and the built environment - these problems will become more challenging
    and complex due to future hazards and conditions. There is a need to understand
    the provisions of existing design standards and available technical guideline
    in geotechnical engineering to incorporate and mitigate the impacts of future
    extreme weather, sea level change, and groundwater depletion. Without clear and
    consistent guidelines across the nation, a situation is unfolding that will likely
    result in a patchwork of recommendations and requirements that may vary by state
    and level of engineering rigor. This report assesses the current state of geotechnical
    engineering practice to address these needs. First, a summary of relevant national
    standards and guidelines, grouped based on different types of geotechnical work,
    is presented. Next, areas where state/local documents substantially modify or
    expand on national-level guidelines are identified for several selected states.
    The report finds that existing standards have three levels of coverage for the
    potential effects of future hazards. Explicit guidelines is rarely present. However,
    many existing design requirements may implicitly encompass future hazards and
    conditions. Even so, when consideration of the potential effects of hazards is
    required in a given code or standard, the accompanying quantitative analysis procedures
    are often lacking. The report concludes with some avenues for future research
    to aid in developing forward-thinking design procedures that integrate recent
    advances in climate science and soil mechanics

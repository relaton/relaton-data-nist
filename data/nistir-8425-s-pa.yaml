abstract:
- language: en
  script: Latn
  content: Esta publicación documenta el perfil del consumidor del núcleo básico de
    Internet de las Cosas (IoT) del NIST e identifica las capacidades de ciberseguridad
    comúnmente necesarias para el sector de IoT del consumidor (es decir, productos
    IoT para uso doméstico o personal). También puede ser un punto de partida para
    que las empresas tengan en cuenta la compra de productos IoT. El perfil del consumidor
    se desarrolló como parte de la respuesta del NIST a la Orden Ejecutiva 14028 y
    se publicó inicialmente en Recommended Criteria for Cybersecurity Labeling for
    Consumer Internet of Things (IoT) Products (Criterios recomendados para el etiquetado
    de ciberseguridad de los productos de consumo del Internet de las cosas (IoT)).
    Las capacidades del perfil del consumidor se formulan como resultados de ciberseguridad
    que se pretenden aplicar a todo el producto IoT. Este documento también analiza
    los fundamentos para desarrollar el perfil del consumidor recomendado y las consideraciones
    relacionadas. Para elaborar el perfil del consumidor, el NIST revisó una serie
    de documentos de referencia y colaboró con las partes interesadas durante un año.

abstract:
- language: en
  script: Latn
  content: In this work, we compiled and evaluated phase transition temperatures for
    the solid elements that can exist in two or more crystalline forms (allotropes).
    For reference purposes, we also include other elements where only melting points
    (solid liquid) exist. We provide both solid- solid transitions (e.g., αβ, βγ)
    and solid-liquid melting point transitions (e.g., α-liq, γ-liq). The crystal phases
    are labeled by Greek letters using the most common conventions. The crystal structures
    of the allotropes are also provided (e.g., mP-aP, bcc-hcp, A-oP, Rfcc). We also
    include magnetic phase transitions for the elements where they exist, e.g., α(TTC)
    andα(TN) for Curie and Néel transitions, respectively.

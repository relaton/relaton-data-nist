abstract:
- language: en
  script: Latn
  content: In December 2023, NIST released a publication outlining a proposed data-sharing
    platform, titled “Building a Metrology Exchange to Innovate in Semiconductors
    (METIS).” The publication was open to public comment from December 2023 to February
    2024 to allow for a diversity of people to contribute their viewpoints and to
    ensure that stakeholders could provide critical feedback to shape the final paper
    outlining the vision for this data exchange. NIST received numerous comments and
    identified trends that fell broadly into four specific categories. In this publication,
    NIST discusses the trends and themes that emerged and provides thematic responses.

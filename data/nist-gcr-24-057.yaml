abstract:
- language: en
  script: Latn
  content: This work presents and catalyzes support for a technology roadmap to improve
    the resilience and capacity of the US manufacturing supply chain through Digital
    Thread technology. Risks to supply chain resilience and capacity are mapped against
    envisioned capabilities for Digital Thread technology in 4 industry sectors. The
    sectors are Aerospace and Defense, Energy, Agriculture/Food, and the Pharmaceutical,
    Biopharmaceutical, and Medical Device (PBMD).

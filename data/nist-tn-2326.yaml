abstract:
- language: en
  script: Latn
  content: A set of approximate first-order ordinary differential equations was derived
    from the general dynamic equation (GDE) to study the aerosol dynamics with homogeneous
    nucleation and condensational diffusion-limited growth in an isothermal batch
    reactor. A lognormal size distribution was used, as an example, to illustrate
    the closure of the problem associated with the recursive nature of the moment
    equations in the formulation. The resulting set of approximate equations can be
    solved numerically to obtain the temporal variations of number concentration,
    volume fraction, vapor depletion, and other moments.

abstract:
- language: en
  script: Latn
  content: 'This report provides supplemental information to NISTIR 8351 DNA Mixture
    Interpretation: A NIST Scientific Foundation Review and summarizes the history
    of DNA mixture interpretation. Over the past 40 years, there has been an evolution
    of new technologies for DNA analysis (different markers, kits, instruments, and
    software) and new strategies for DNA mixture interpretations (manual deconvolution,
    binary and probabilistic models) along with a steady stream of peer-reviewed publications.
    Forensic DNA testing exists in this evolving environment with an increasingly
    complex set of technologies. Often, important changes and advances have been made
    across the community because of experiences in high-profile court cases or awareness
    of issues raised through participation in interlaboratory studies or collaborative
    exercises. Several of these cases and studies are highlighted here. Histories
    of guidance documents and training courses related to DNA mixture interpretation
    are also described. Recommendations on DNA mixture interpretation from a 2006
    International Society for Forensic Genetics DNA Commission (see Box S1.4) serve
    as core foundational principles. The field would benefit from future guidance
    documents promoting performance-based approaches to validation studies and continued
    education and research in DNA mixture interpretation.'

abstract:
- language: en
  script: Latn
  content: The Domain Name System (DNS) is an integral part of any enterprise network
    architecture. An attack against the DNS infrastructure of an enterprise threatens
    every network operation in that enterprise. DNS operations are composed of different
    roles that each have their own set of security considerations. This document provides
    DNS deployment guidelines to secure the DNS protocol and infrastructure, mitigate
    misuse or misconfiguration, and provide an additional layer of network security
    as part of a zero trust and/or defense-in-depth security risk management approach.

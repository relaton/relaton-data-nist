abstract:
- language: en
  script: Latn
  content: 'The procedures used by the National Institute of Standards and Technology
    (NIST) to establish certified Rockwell C hardness (HRC) values for three Standard
    Reference Materials (SRMs): SRM2810a (low range, nominal 25 HRC), SRM 2811a (medium
    range, nominal 45 HRC), and SRM 2812a (high range, nominal 63 HRC), are documented.
    These materials serve as the primary transfer standards of NIST’s realization
    of the Rockwell C Hardness Scale. These standards are used for the calibration
    and verification of Rockwell C hardness testing machines, and they provide a direct
    link in the traceability chain through the International System of Units or SI-traceable
    force and depth measurements. Certified values were obtained using the NIST Primary
    Hardness Standard Machine (PHSM) under conditions consistent with ASTM E18-25
    (2025), ISO 6508-1 to -3 (2023), and the Consultative Committee for Mass and Related
    Quantities (CCM) Working Group on Hardness (WGH) definition of the Rockwell C
    hardness scale. The certification process included the direct verification of
    the test forces using calibrated force measuring instruments (load cells) and
    the calibration of the depth measuring system using laser interferometry with
    gauge block stacks, both traceable to the SI. It also incorporated a statistical
    evaluation of hardness measurements across multiple blocks spanning the low, medium,
    and high hardness ranges. Comparisons with historical NIST certifications and
    international key comparison results confirmed continuity of traceability. The
    resulting certified values and expanded uncertainties provide industry and the
    hardness metrology community with reliable reference standards that ensure accuracy
    and global comparability of Rockwell C scale hardness measurements.'

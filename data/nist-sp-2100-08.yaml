abstract:
- language: en
  script: Latn
  content: This report summarizes discussions from the Mission Critical Voice Virtual
    Roundtable hosted by the Public Safety Communications Research (PSCR) Division
    of the National Institute of Standards and Technology (NIST) in April 2024. PSCR
    convened 37 first responders and communications engineers from across the United
    States, representing diverse public safety disciplines. Discussions focused on
    the current state of mission-critical voice communications, challenges faced by
    first responders, and the transition to and integration of new technologies. The
    report also details subsequent deep-dive conversations with an expanded set of
    first responders at the 5x5 Public Safety Innovation Summit, held in June 2024.

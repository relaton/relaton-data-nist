abstract:
- language: en
  script: Latn
  content: 'Portuguese Translation of NIST IR 8425: Esta publicação documenta o perfil
    do consumidor da linha de base principal da Internet das Coisas (IoT) do NIST
    e identifica os recursos de segurança cibernética normalmente necessários para
    o setor de IoT do consumidor (ou seja, produtos de IoT para uso doméstico ou pessoal).
    Ela também pode ser um ponto de partida para as empresas considerarem a compra
    de produtos de IoT. O perfil do consumidor foi desenvolvido como parte da resposta
    do NIST à Ordem Executiva 14028 e foi publicado inicialmente em Recommended Criteria
    for Cybersecurity Labeling for Consumer Internet of Things (IoT) Products (Critérios
    recomendados para rotulagem de segurança cibernética para produtos de Internet
    das Coisas (IoT) para consumidores). Os recursos do perfil do consumidor são formulados
    como resultados de segurança cibernética que devem ser aplicados a todo o produto
    de IoT. Este documento também discute os fundamentos para o desenvolvimento do
    perfil de consumidor recomendado e considerações relacionadas. O NIST analisou
    um conjunto de documentos relevantes para informar o perfil do consumidor e se
    envolveu com as partes interessadas em um esforço de um ano para desenvolver as
    recomendações.'

abstract:
- language: en
  script: Latn
  content: Standard Reference Material (SRM) 2890a Water in 1-Octanol is intended
    for use in validating methods and calibrating instruments for the measurement
    of trace concentration levels of water. SRM 2890a is a solution of water in 1-octanol
    which is certified for its water content. A unit of SRM 2890a consists of five
    5 mL ampoules, each containing approximately 2 mL of water in 1-octanol. This
    publication documents the production, analytical methods, and computations involved
    in characterizing this product.

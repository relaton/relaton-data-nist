abstract:
- language: en
  script: Latn
  content: 'Identification of unknown mass spectra is a fundamental task in analytical
    chemistry. The unambiguous identification of mass spectra remains a challenge
    for compounds similar in structure. A novel mathematical approach incorporating
    measurement variability in replicate mass spectra was proposed in Roberts et al.,
    [1]. The method shows potential in discriminating similar compounds given replicate
    mass spectra and has been implemented in a software package called HDCMS (high
    dimensional consensus mass spectra). In this work, we describe the algorithmic
    considerations underpinning the HDCMS package, including: data preprocessing,
    constructing HDCMS from replicate measurements, and comparing pairs of HDCMS.
    We then demonstrate use of the software and summarize the performance on two lab
    collected data sets.'

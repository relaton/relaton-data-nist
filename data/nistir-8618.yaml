abstract:
- language: en
  script: Latn
  content: 'This report summarizes the presentations and feedback received by the
    NIST Cybersecurity for the Internet of Things (IoT) Program at the hybrid workshop
    on "Cybersecurity for IoT Workshop: Future Directions” held March 31 – April 1,
    2026. The purpose of this workshop was to consider emerging and future trends
    for IoT technologies, and their impact to IoT cybersecurity. Additionally, the
    workshop was intended to inform updates to NIST SP 800-213 and the development
    of future IoT cybersecurity guidelines.'

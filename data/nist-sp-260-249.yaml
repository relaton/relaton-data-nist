abstract:
- language: en
  script: Latn
  content: A set of 64 step height standards were made each containing three steps
    of 10 µm, 50 µm, and 100 µm. The form factor of this standard makes it conducive
    for introduction into general and ballistics-specific areal three-dimensional
    (3D) surface topography microscopes used in forensic firearm and toolmark evaluations.
    It is an aluminum cylinder 21.5 mm in diameter and 25 mm tall, simulating a 12-gauge
    shotgun shell. The calibrated step heights enable customers to calibrate and maintain
    statistical control of their 3D microscopes This SRM provides the means to calibrate
    a microscope’s Z-axis (vertical) amplification coefficient (scale) and linearity
    deviation. This NIST SP-260 provides details on the source and preparation of
    the step height standards as well as the analytical approach to use coherence
    scanning interference microscopy to calibrate the step heights. The statistical
    approach and uncertainty budget is described.

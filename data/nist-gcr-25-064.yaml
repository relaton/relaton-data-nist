abstract:
- language: en
  script: Latn
  content: The project is for a one-year study to evaluate universities that have
    been designated as Innovation and Economic Prosperity Universities (IEPUs), by
    the Association of Public and Land-Grant Universities (APLU) for their approaches
    to innovation and technology commercialization and to review and evaluate existing
    technology-based collaborations between the IEPUs and technology development entities,
    including Federal Research Laboratories (FRLs). It is expected that the recipient
    will (1)research and broadly disseminate a set of best practice recommendations
    for increased innovation, commercialization, technology transfer, entrepreneurship
    and regional partnering and development activities based on the specific activities
    of the IEPUs; (2) identify existing collaboration networks of IEPUs and technology
    development entities, including FRLs; 3) identify overlaps and gaps in technology
    based collaboration networks between IEPUs and technology development entities;
    4) recommend 6 pilot projects for new or expanded networks or clusters of IEPUs
    and technology development entities, including FRLs; 5) develop an analysis of
    potential economic impact of 6 pilots and plan for longer term scale-up, to aid
    in future resource prioritization.

abstract:
- language: en
  script: Latn
  content: 'Use the CSF to Improve Your C-SCRM Processes. The CSF can help an organization
    become a smart acquirer and supplier of technology products and services. This
    guide focuses on two ways the CSF can help you: 1) Use the CSF’s GV.SC Category
    to establish and operate a C-SCRM capability. 2) Define and communicate supplier
    requirements using the CSF.'

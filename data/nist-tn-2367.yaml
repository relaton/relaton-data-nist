abstract:
- language: en
  script: Latn
  content: National Institute of Standards and Technology (NIST) Special Database
    302 contains 10000latent impression distal phalanx images. This collection of
    data came from the Intelligence Advanced Research Projects Activity’s Nail to
    Nail Fingerprint Challenge. NIST worked with Certified Latent Print Examiners
    to annotate these images with features (e.g., minutiae, orientation, ridge quality
    maps) and determine their ground truth finger positions. The fully-annotated collection
    of data is made freely available for research purposes

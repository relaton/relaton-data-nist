abstract:
- language: en
  script: Latn
  content: This Quick-Start Guide (QSG) draws on concepts and practices from enterprise
    risk management, cybersecurity risk management, and workforce management to help
    organizations improve communication about cybersecurity risks and to plan and
    implement workforce decisions based upon risk reality and planned risk responses.
    The scope of this QSG will vary depending on the user, but generally applies at
    the organization level, where cybersecurity risks of multiple systems are managed,
    and at the enterprise level, where senior leaders take on unique risk management
    responsibilities spanning multiple organizations. This QSG addresses the need
    for agile, continuous workforce adaptation to rapidly evolve for emerging threats
    and technologies.

abstract:
- language: en
  script: Latn
  content: 'It remains challenging to integrate artificial intelligence (AI) and natural
    language processing (NLP) into complex engineering systems. Popular models and
    techniques are designed for use with everyday, non-technical text, and therefore
    perform poorly when attempting to interpret language containing specialized terminology
    or context-specific meanings. Technical Language Processing (TLP) attempts to
    address these challenges by tailoring NLP approaches for use in technical and
    engineering domains. As a nascent field, community-driven events have played a
    crucial role in facilitating dialogue on emerging issues and potential solutions.
    In 2024, the TLP Community of Interest (COI), overseen by the National Institute
    of Standards and Technology (NIST), organized two events: a two day virtual workshop
    hosted by NIST, and a panel at the Annual Conference of the Prognostics and Health
    Management (PHM) Society. These two events provided opportunities for experts
    from academia, industry, and government to discuss the application of TLP and
    Large Language Models (LLMs) in industrial settings. This paper summarizes the
    key discussions and insights from the events, while highlighting the community''s
    collective efforts to advance the application of TLP and LLMs in the industrial
    sector.'

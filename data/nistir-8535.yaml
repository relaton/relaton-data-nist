abstract:
- language: en
  script: Latn
  content: This study evaluates the material properties of an X100 pipeline steel
    extracted from an experimental transmission pipeline section placed into service
    in the 1960s. The purpose is to compare these properties with current X100 steel
    standards. Comprehensive chemical characterization, microstructure analysis, and
    a series of mechanical tests—including tensile, Charpy impact, and indentation
    tests—were conducted to assess the long-term stability and reliability of these
    early high-strength steels. The analysis involved seven different welded sections
    of the pipeline to account for potential variations within the material and welding
    procedures. The findings indicate significant differences in chemical composition
    across the various pipe sections, suggesting that these sections may represent
    different experimental materials. The base metal predominantly exhibited a bainite-ferrite
    microstructure, with noticeable variations near the pipe surfaces. Unannealed
    girth welds demonstrated higher toughness and increased hardness in their heat-affected
    zones compared to seam welds. While most sections of the vintage X100 steel met
    the modern tensile property requirements, several sections did not meet the impact
    toughness criteria. In conclusion, the experimental X100 steel aligns with current
    tensile property requirements, however the steel fails to meet current toughness
    related requirements. The observed differences in testing methods between current
    standards and those published in the 1960s were minor, and therefore not a convincing
    source for observed property differences considering all sources of uncertainty.
    The absence of original pre-service mechanical testing data prevents conclusions
    about time-dependent property changes.

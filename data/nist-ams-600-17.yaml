abstract:
- language: en
  script: Latn
  content: This review of China's Manufacturing Innovation Centers (MICs) describes
    the status of the country's flagship manufacturing innovation program. At least
    33 MICs have been established to date, suggesting that China is within reach of
    its goal of 40 MICs by 2025, as stated in the "Made in China 2025" national strategy.
    This review discusses the motivation, structure, and results of the implementation
    of the Manufacturing Innovation Centers so far, particularly with respect to their
    14th Five-Year Plan, and compares China's approach to manufacturing innovation
    with that of the Manufacturing USA program and Germany's Fraunhofer Institutes.
    China views strategic investment in critical advanced manufacturing technologies
    as a focal point for furthering national interest and technical leadership.

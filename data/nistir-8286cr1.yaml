abstract:
- language: en
  script: Latn
  content: This document is the third in a series that supplements NIST Interagency
    Report (IR) 8286, Integrating Cybersecurity and Enterprise Risk Management (ERM).
    This series provides additional details regarding enterprise application of cybersecurity
    risk information; the previous documents, IRs 8286A and 8286B, provide details
    regarding stakeholder risk direction and methods for assessing and managing cybersecurity
    risk in light of enterprise objectives. This report, IR 8286C, describes how information
    recorded in cybersecurity risk registers may be integrated as part of a holistic
    approach to ensuring that risks to information and technology are properly considered
    for the enterprise risk portfolio. This cohesive understanding supports an enterprise
    risk register and enterprise risk profile that, in turn, support the achievement
    of enterprise objectives.

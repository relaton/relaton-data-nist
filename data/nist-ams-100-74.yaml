abstract:
- language: en
  script: Latn
  content: The 2023 Photopolymer Additive Manufacturing Alliance (PAMA) Workshop convened
    experts from academia, industry, and government to explore the state-of-the-art
    and future opportunities in photopolymer-based 3D printing. The workshop was organized
    around seven thematic panels addressing data-driven discovery, biomedical applications,
    sustainability, advanced material integration, and measurement/standardization.
    Together, the panels underscored the rapid evolution of photopolymer AM from an
    exploratory research field to a scalable and application-driven manufacturing
    platform. They highlighted opportunities in leveraging data science, enabling
    biomedical breakthroughs, embedding sustainability, expanding materials beyond
    polymers, and developing measurement and standardization frameworks. The workshop
    also identified a set of roadmaps to guide future research, industrial collaboration,
    and standards development.

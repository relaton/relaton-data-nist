abstract:
- language: en
  script: Latn
  content: The temo library is a set of building blocks that facilitate the automation
    of fitting models to experimental data for thermodynamic properties. The library
    is written in Python to enable broad re‐use and is based upon the suite of thermodynamic
    equations of state and modeling tools available in the teqp library. The flexibility
    of the provided methods allow the user to extend the capabilities of temo for
    their own particular problems.

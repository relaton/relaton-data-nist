abstract:
- language: en
  script: Latn
  content: In the U.S., building codes and standards have been developed to reduce
    the likelihood of building collapse but do not address the loss of building functions
    or recovery times due to earthquakes. When scaled to the community level, negative
    consequences, such as lack of access to jobs and schools and, ultimately, population
    displacement, may occur. Buildings and infrastructure systems can be improved
    to better meet the needs of users and occupants after natural hazard events. These
    needs include the ability to reoccupy and resume functions and services across
    the assets that most benefit society. Research in earthquake engineering and social
    science has advanced a new performance objective called functional recovery that
    supports the design of assets to meet needs beyond what is currently required
    by codes and standards. Implementation of functional recovery design will enable
    buildings and infrastructure systems to sustain less damage in earthquake events
    and return to a basic level of service more quickly, reducing downtime for key
    societal activities as well as direct and indirect costs of damages, repairs,
    or demolition.

abstract:
- language: en
  script: Latn
  content: The HVAC&R industry is facing the challenge of phasing down the use of
    the HFC (hydrofluorocarbon) refrigerants. New energy-efficient refrigerants are
    required, and accurate property data for them are needed to design and operate
    new HVAC equipment using the new refrigerants. The present work has measured property
    data on key mixtures among the olefins R-1234yf, R-1234ze(E), R-1130(E), R-1132a,
    R-1132(E), and R-1336mzz(Z), together with the HFCs R-152a, R-32, and R-227ea.
    Measurements were also carried out on pure R-1130(E). Included were vapor-liquid
    equilibrium (VLE) measurements, pressure-density-temperature-composition (p, ρ,
    T, x) data, and speed of sound. This report summarizes the measurements carried
    out, describes the experimental techniques used, and gives examples of the results.
    These data were then used to develop models of the thermodynamic properties; these
    are expressed in terms of “equations of state” (EOS). In addition to the mixture
    models, EOS are presented for pure R-1130(E) and R-1132(E). The main output of
    the project takes the form of the numerical parameters for the pure-fluid and
    mixture models, which are reported here and in the form of data files for use
    with the NIST REFPROP database of refrigerant properties. Full details of both
    the experimental and modeling efforts are given in papers published in archival
    journals, which are linked in the report. The present work has added important
    new refrigerants and refrigerant blends to the existing data set. As a result,
    industry is able to evaluate a wider range of options.

abstract:
- language: en
  script: Latn
  content: This technical report outlines the design and implementation of a structured
    experimental framework to evaluate passenger comfort during braking in automated
    vehicles (AVs). The study focuses on how initial velocity and available stopping
    distance influence deceleration profiles and perceived ride quality. Using a controlled
    test environment, a series of trials were conducted across a range of speeds and
    distances, with repeatable braking event to simulate realistic AV operations.
    Quantitative measures such as acceleration, jerk, and braking duration were recorded
    using an instrumented test vehicle to assess the comfort level of the brakes.
    The experimental protocol emphasizes repeatability and scalability to support
    future studies involving connected infrastructure, and ensures repeatability,
    minimizes external variability, and allows comparison across braking force levels.
    This framework is intended to serve as a standardized test plan for evaluating
    AV braking comfort in real-world or closed-course environments.

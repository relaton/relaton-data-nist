abstract:
- language: en
  script: Latn
  content: This guideline focuses on the use of federated identity and the use of
    assertions to implement identity federations. Federation allows a given credential
    service provider to provide authentication attributes and (optionally) subscriber
    attributes to a number of separately-administered relying parties. Similarly,
    relying parties may use more than one credential service provider. The guidelines
    are not intended to constrain the development or use of standards outside of this
    purpose. This publication supersedes NIST Special Publication (SP) 800-63C.

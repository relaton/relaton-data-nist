abstract:
- language: en
  script: Latn
  content: A key area in natural language processing and by extension, in artificial
    intelligence, is a system’s ability to extract entities (things in the world),
    events (who does what and when), and relations (who is related to whom in what
    way) and to transform unstructured data into structured data enabling automated
    analysis, knowledge graph construction, and deeper understanding for tasks like
    trend analysis, threat detection, personalized recommendations, and building medical
    databases by identifying who, what, where, and when in text, and the connections
    between them. To measure a system’s performance, it is often the case that evaluation
    reference data is created by human annotators. This document provides overall
    annotation guidelines for annotators as part of the RUFEERS evaluation.

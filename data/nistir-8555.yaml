abstract:
- language: en
  script: Latn
  content: The National Marine Mammal Tissue Bank (NMMTB) was initiated in 1987 by
    the National Oceanic and Atmospheric Administration’s (NOAA) National Marine Fisheries
    Service (NMFS) to collect select marine mammal tissues for long-term cryogenic
    archival. In 1992, the NMMTB was formally established by Federal Legislation (Public
    Law 102-587) and a portion of tissues collected by NMFS’s Marine Mammal Health
    and Stranding Response Program (MMHSRP) are archived in the NMMTB. The MMHSRP
    obtains specimens from marine mammal strandings and from animals taken incidentally
    during commercial fishing operations and emphasizes contaminant monitoring and
    information management. Specimens from Alaska are archived in the NMMTB through
    the Alaska Marine Mammal Tissue Archival Project (AMMTAP). AMMTAP was initiated
    in 1987 with sponsorship from the U.S. Department of the Interior, Minerals Management
    Service (MMS). The goal of this program is to establish a representative collection
    of marine mammal tissues taken during Alaska Native subsistence activities for
    future contaminant analyses and documentation of long-term trends in environmental
    quality. The cryogenic banking facilities for the NMMTB are operated by the NIST
    Chemical Sciences Division at the NIST Biorepository in Charleston, South Carolina
    at the Hollings Marine Laboratory.

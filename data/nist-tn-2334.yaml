abstract:
- language: en
  script: Latn
  content: Turnout gear protects firefighters from exposure to flames, heat, and liquids
    and is made from textiles which have been found to contain per- and polyfluoroalkyl
    substances (PFAS). Previous examinations of PFAS in turnout gear have predominantly
    utilized targeted analytical approaches, which quantify a limited number of PFAS
    with established quantitative methods. This NIST Technical Note describes the
    first use of liquid chromatography high-resolution mass spectrometry combined
    with suspect screening to search for the presence of over 4,000 PFAS in firefighter
    turnout gear textiles. PFAS were ionized with negative mode electrospray and the
    resulting mass spectral features were screened against the NIST PFAS Suspect List
    as either deprotonated ions ([M-H]-) or acetate adducts ([M+C2H3O2]-), which enabled
    the detection of a highly chemically diverse set of PFAS. Molecular formulas were
    assigned to mass spectral features by comparison of precursor ion spectra against
    predicted isotopic distributions while chemical identities were determined and
    evaluated by comparison of precursor and product ion spectra against previously
    collected spectra using the NIST Database Infrastructure for Mass Spectrometry
    (DIMSpec) application MSMatch. Six PFAS compound identities were confirmed in
    firefighter gear textiles with high confidence, including four that were not quantified
    in a previously reported targeted analysis of the same textiles. Additionally,
    this is the first reported identification of three PFAS (perfluoro butane sulfonamide
    ethanol, perfluorobutane sulfonamido diethanol, and 6:2 fluorotelomer sulfate)
    in any outerwear textile. Overall, this NISTTechnical Note demonstrates the need
    for PFAS screening techniques can discern a broader swath of PFAS than targeted
    analysis alone and also the capability of DIMspec and MSMatch to provide and evaluate
    PFAS compound annotations.

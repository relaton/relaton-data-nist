abstract:
- language: en
  script: Latn
  content: Artificial Intelligence (AI) has progressed significantly and impacted
    various aspects of our daily life. With its strength in prediction, AI is considered
    a powerful tool for assessing and managing risks because it can take into account
    a large amount and variety of data. Global supply chains, in recent years, have
    been exposed to dramatic uncertainty due to a variety of natural and artificial
    causes. Therefore, managing supply chains becomes an increasingly high dimensional
    problem where AI could play a crucial role. This motivated us to organize a workshop
    on the Application of AI in supply chain management at the Advances in Production
    Management Systems (APMS) international conference 2025 in Kamakura, Japan. The
    workshop is designed as a working session with the aim to gather ideas and opinions
    from participating experts on what AI might contribute to the SCM processes and
    identify their maturity and research opportunities. This paper summarizes the
    talks and the outcomes of the workshop.

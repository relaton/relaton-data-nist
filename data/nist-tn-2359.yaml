abstract:
- language: en
  script: Latn
  content: 'The purpose of the National Advanced Spectrum and Communications Test
    Network (NASCTN) Citizens Broadband Radio Service (CBRS) Sharing Ecosystem Assessment
    (SEA) project is to provide data-driven insight into the CBRS sharing ecosystem’s
    effectiveness between commercial and Department of Defense (DoD) incumbent systems,
    and to track changes in the spectrum environment over time. CBRS is the “first
    of a kind” nationwide shared spectrum ecosystem in the 3550-3700 MHz band. The
    implementation of this project included the installation of sensor systems at
    selected sites on the east and the west coast of the United States, along with
    a control and prototyping system in Boulder, Colorado. This data manual provides:
    1. Introduction: A brief description of the NASCTN CBRS SEA program, installed
    sensor sites and scope. 2. Data Repository: A description of the the active data
    sharing program. 3. Data Structures and Manipulation Code: An in-depth description
    of the data structure and code used to interact with the data. 4. Sensor Data
    and Signal Processing: A discussion of the signal processing of collected in-phase
    - quadrature data that results in the published data product.'

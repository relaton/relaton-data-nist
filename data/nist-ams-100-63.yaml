abstract:
- language: en
  script: Latn
  content: Stepper photolithography combined with deep reactive ion etching was used
    to generate controlled flaws to assess X-ray computed tomography (XCT) flaw detectability.
    Holes ranging in sizes from a few micrometers to hundreds of micrometer level
    were generated. Various shapes and distribution patterns of holes were demonstrated.
    Capabilities to generate simple cylindrical holes to more complex cavities with
    scalloping surfaces representative of metal additive manufacturing lack-of-fusion
    pores were also demonstrated. Silicon direct bonding method was demonstrated to
    encapsulate the generated holes into pores. Scanning electron microscopic images
    were acquired to assess the manufacturing quality and to calibrate the flaw sizes.
    Reference measurement processes and results are discussed.

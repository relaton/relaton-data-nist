abstract:
- language: en
  script: Latn
  content: The BLEVE (boiling liquid expanding vapor explosion) hypothesis on fire-induced
    spalling of concrete was examined using superheated liquid theory. Water trapped
    within a heated interior region of concrete was used as an idealized system to
    determine the thermodynamic conditions of water that subsequently would lead to
    potential occurrence of a BLEVE event. The thermodynamic states that favor BLEVE
    was identified and delineated in the P–T phase diagram of water and was shown
    to be highly constrained to narrow ranges of temperature and the amount of water
    trapped (fill density) in the heated region.

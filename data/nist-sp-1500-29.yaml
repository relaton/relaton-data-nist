abstract:
- language: en
  script: Latn
  content: Artificial Intelligence (AI) is becoming more pervasive in society, including
    public safety. There is a growing need for safety guidelines as AI becomes more
    integrated within electronic safety products used within the fire service. A group
    comprised of firefighters, electronic safety equipment manufacturers, and researchers
    have come together to identify and highlight considerations for implementing AI
    in electronic safety products for use by firefighters and support personnel. This
    document provides an overview of those suggested guidelines while detailing definitions,
    risk management, standards development considerations, and the use of AI in the
    fire service.

abstract:
- language: en
  script: Latn
  content: This report proposes an organization-wide system of continuous improvement
    to increase impact in advancing U.S. manufacturing competitiveness. To maximize
    the impact of each dollar invested in research and development (R&D), change agents
    (i.e., those who invest in advancing manufacturing competitiveness such as governments
    or trade organizations) will likely need to transition from intuition-based selection
    to rigorous measurement science. By treating each R&D project as an experiment
    with a clear hypothesis and measurable outcome, organizations can create a feedback
    loop that systematically improves future investment accuracy.

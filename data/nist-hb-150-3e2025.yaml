abstract:
- language: en
  script: Latn
  content: NIST Handbook 150-3 presents the technical requirements and guidance for
    the accreditation of laboratories under the National Voluntary Laboratory Accreditation
    Program (NVLAP) Bulk Asbestos Fiber Analysis program. It is intended for information
    and use by accredited laboratories, laboratories seeking accreditation, laboratory
    accreditation systems, users of laboratory services, and others needing information
    on the requirements for accreditation under this program. The 2024 edition of
    NIST Handbook 150-3 aligns with ISO/IEC 17025:2017. The requirements of NIST Handbook
    150 and the specific requirements and interpretations in the NIST Handbook 150-3
    must be combined to produce the criteria for accreditation in the NVLAP Bulk Asbestos
    Fiber Analysis program. For more information visit the NVLAP website (http://www.nist.gov/nvlap).

abstract:
- language: en
  script: Latn
  content: Traction batteries, or electric-drive battery pack systems, rely on critical
    materials and minerals that are vulnerable to supply chain disruptions, making
    recovery and recycling crucial to reducing reliance on raw, mined resources and
    bolstering domestic inventories of critical minerals. In response, stakeholders
    from across the EVB supply chain are collaborating to drive changes to existing
    material flow systems. The Engineering Laboratory (EL) and Material Measurement
    Laboratory (MML) at the National Institute of Standards and Technology (NIST)
    have developed a baseline, open-source EVB recovery material flow reference model
    to facilitate communication and clarity around the technical processes and information
    needs for battery recovery. This model has the potential to support the development
    of a nascent and emerging industry, enabling more efficient and sustainable EVB
    recovery and material recovery practices. By providing a common reference point,
    the model can help stakeholders to identify new opportunities, inform decision-making,
    and drive innovation in the field.

abstract:
- language: en
  script: Latn
  content: Standard Reference Material (SRM) 2942a is a cuvette-shaped, Ce-ion-doped
    glass, recommended for use for relative spectral correction of emission from 320
    to 430 nm and day-to-day performance verification of steady-state fluorescence
    spectrometers. It was certified for relative intensity of fluorescence as a function
    of emission wavelength. SRM 2942a is a renewal of SRM 2942, which was originally
    released by NIST in 2009. The techniques and methods used to determine the certified
    values and uncertainties are described here. Material properties that were explored
    include photostability, absorbance, dissolution rate in water, anisotropy and
    temperature coefficient of fluorescence intensity. The expanded uncertainties
    in the certified spectrum are about 5% around the peak maximum at 330 nm, using
    an excitation wavelength of 310 nm. The SRM also exhibits a strong resistance
    to photodegradation.

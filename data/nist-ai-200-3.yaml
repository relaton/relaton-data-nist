abstract:
- language: en
  script: Latn
  content: 'This document outlines the components for evaluating an AI application using the NIST Assessing Risks and Impacts of AI (ARIA) approach. The ARIA Evaluation Planning Manual is designed to illustrate the various elements of conducting a holistic AI evaluation and can bemused as a first step in developing new, customized AI evaluations. The ARIA approach assesses an AI system’s trustworthiness by combining data from three types of testing: Model Testing, Red Teaming, and User Testing. This manual lists the necessary evaluation elements and provides links to available resources for developing materials and infrastructure.'

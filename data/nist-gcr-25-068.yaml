abstract:
- language: en
  script: Latn
  content: The Bullet Black Box Working Group (BulletBB-WG) was convened to review
    the results of the NIST-Noblis Bullet Black Box Study, and assess the implications
    of that study on casework. This report includes the recommendations of the BulletBB-WG
    on how to address those implications with the goal of improving the practice of
    the comparison of bullets by forensic firearms examiners. BulletBB-WG’s recommendations
    focus on standard operating procedures in casework, quality assurance, training,
    proficiency and competency testing, standardization, testimony, admissibility,
    and use/communication of the Bullet Black Box Study results.

abstract:
- language: en
  script: Latn
  content: Few software development life cycle (SDLC) models explicitly address software
    security indetail, so secure software development practices usually need to be
    added to each SDLC modelto ensure that the software being developed is well-secured.
    This document recommends theSecure Software Development Framework (SSDF) – a core
    set of high-level secure softwaredevelopment practices that can be integrated
    into each SDLC implementation. Following suchpractices should help software producers
    reduce the number of vulnerabilities in releasedsoftware, reduce the potential
    impact of the exploitation of undetected or unaddressedvulnerabilities, and address
    the root causes of vulnerabilities to prevent future recurrences.Because the framework
    provides a common vocabulary for secure software development,software acquirers
    can also use it to foster communications with suppliers in acquisitionprocesses
    and other management activities.

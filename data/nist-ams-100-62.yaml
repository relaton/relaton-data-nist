abstract:
- language: en
  script: Latn
  content: 'This report serves as a guide to the Smart Investment Tool and Smart Investment
    Tool Express (SITExpress). These tools aid a user in conducting an investment
    analysis with a focus on those in the manufacturing industry; however, the methods
    can be used for any investment. The Smart Investment Tool is an Excel tool that
    allows users to specify detailed cash flows and estimates net present value, internal
    rate of return, payback period, and examines sensitivity using Monte Carlo analysis.
    SITExpress is an express version of the Smart Investment Tool where it estimates
    similar metrics (net present value, internal rate of return, payback period, and
    the benefit cost ratio) from user data. The express version, however, is an online
    tool where the user enters aggregated total annual cash inflows and outflows;
    that is, the user only enters two values for each year: cash inflow and cash outflow.
    The express version also does not have the ability to conduct sensitivity analysis.'

abstract:
- language: en
  script: Latn
  content: Standard Reference Material (SRM) 1641f Mercury in Water is intended for
    the calibration of instruments and techniques used for the determination of mercury
    in natural waters. It is designed for the preparation of calibration solutions
    and for use as a “spike” sample in a “method-of-additions” analytical procedure.
    A unit of SRM 1641f consists of ten ampoules, each ampoule containing approximately
    10 mL of solution consisting of a trace amount of mercury in approximately 3%
    mass fraction nitric acid and 2% mass fraction hydrochloric acid. This publication
    documents the production, analytical methods, and computations involved in characterizing
    this product.

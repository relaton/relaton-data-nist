abstract:
- language: en
  script: Latn
  content: This report presents the design and methodology of a survey conducted to
    evaluate the impact of changes to the organizational publication review policy
    at the National Institute for Standards and Technology (NIST). The purpose of
    the survey is to collect feedback from staff on their understanding and perceptions
    of the policy update. The survey instrument includes modules on experience with
    the previous policy, the purpose of the policy, high-level key changes, and specific
    changes to the review process. The results of this survey are intended to inform
    ongoing monitoring and evaluation of the policy, processes, and procedures for
    review and clearance of publications at NIST. Moreover, the questions presented
    in the current data collection instrument may be relevant to development of other
    data collections instruments, specifically other publication review processes
    and more generally program evaluation of organizational policy updates.
